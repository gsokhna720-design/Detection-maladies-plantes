/* ══════════════ PARTICLE FIELD ══════════════ */
function ParticleField() {
  var canvasRef = useRef();
  useEffect(function() {
    var canvas = canvasRef.current;
    if (!canvas) return;
    var ctx = canvas.getContext('2d');
    var W, H;
    var mouse = { x: -9999, y: -9999 };
    var animId;

    var resize = function() { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; };
    resize();
    window.addEventListener('resize', resize);
    var onMove = function(e) { mouse.x = e.clientX; mouse.y = e.clientY; };
    window.addEventListener('mousemove', onMove);
    var onLeave = function() { mouse.x = -9999; mouse.y = -9999; };
    window.addEventListener('mouseleave', onLeave);

    var N = 65;
    var pts = [];
    for (var i = 0; i < N; i++) {
      pts.push({ x: Math.random()*W, y: Math.random()*H, vx: (Math.random()-0.5)*0.35, vy: (Math.random()-0.5)*0.35, r: 1.2+Math.random()*1.4 });
    }

    var CONN = 125, REPEL = 110, REPEL_F = 0.045;

    var draw = function() {
      animId = requestAnimationFrame(draw);
      ctx.clearRect(0, 0, W, H);

      for (var k = 0; k < pts.length; k++) {
        var p = pts[k];
        var dx = p.x - mouse.x, dy = p.y - mouse.y;
        var d = Math.sqrt(dx*dx + dy*dy);
        if (d < REPEL && d > 0) {
          var f = (1 - d/REPEL) * REPEL_F;
          p.vx += (dx/d)*f; p.vy += (dy/d)*f;
        }
        p.vx *= 0.994; p.vy *= 0.994;
        var spd = Math.sqrt(p.vx*p.vx + p.vy*p.vy);
        if (spd > 0.75) { p.vx = (p.vx/spd)*0.75; p.vy = (p.vy/spd)*0.75; }
        p.x += p.vx; p.y += p.vy;
        if (p.x < 0) p.x = W; if (p.x > W) p.x = 0;
        if (p.y < 0) p.y = H; if (p.y > H) p.y = 0;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
        ctx.fillStyle = 'rgba(29,185,84,0.45)';
        ctx.fill();
      }

      for (var a = 0; a < pts.length; a++) {
        for (var b = a+1; b < pts.length; b++) {
          var ddx = pts[a].x-pts[b].x, ddy = pts[a].y-pts[b].y;
          var dd = Math.sqrt(ddx*ddx+ddy*ddy);
          if (dd < CONN) {
            ctx.beginPath();
            ctx.moveTo(pts[a].x, pts[a].y);
            ctx.lineTo(pts[b].x, pts[b].y);
            ctx.strokeStyle = 'rgba(74,222,128,'+(1-dd/CONN)*0.13+')';
            ctx.lineWidth = 1;
            ctx.stroke();
          }
        }
      }
    };
    draw();

    return function() {
      cancelAnimationFrame(animId);
      window.removeEventListener('resize', resize);
      window.removeEventListener('mousemove', onMove);
      window.removeEventListener('mouseleave', onLeave);
    };
  }, []);
  return React.createElement('canvas', { id: 'particle-bg', ref: canvasRef });
}

/* ══════════════ GESTION DES UTILISATEURS (Administrateur) ══════════════ */
function UsersAdminPage({ apiUrl, authHeaders, currentUserId }) {
  const [users, setUsers]     = useState([]);
  const [loading, setLoading] = useState(true);
  const [error, setError]     = useState("");
  const [creating, setCreating] = useState(false);
  const emptyForm = {nom:"",prenom:"",email:"",motDePasse:"",role:"maraicher",exploitation:""};
  const [form, setForm] = useState(emptyForm);

  const loadUsers = () => {
    setLoading(true);
    fetch(`${apiUrl}/users`, {headers: authHeaders})
      .then(r => r.json())
      .then(data => { setUsers(Array.isArray(data) ? data : []); setLoading(false); })
      .catch(() => { setError("Impossible de charger les utilisateurs"); setLoading(false); });
  };

  useEffect(() => { loadUsers(); }, []);

  const handleCreate = (e) => {
    e.preventDefault();
    setError(""); setCreating(true);
    fetch(`${apiUrl}/users`, {
      method:  "POST",
      headers: {"Content-Type": "application/json", ...authHeaders},
      body:    JSON.stringify(form),
    })
      .then(async (r) => {
        const data = await r.json();
        if (!r.ok) throw new Error(data.error || "Erreur lors de la création");
        setForm(emptyForm);
        loadUsers();
      })
      .catch((err) => setError(err.message))
      .finally(() => setCreating(false));
  };

  const handleDelete = (id) => {
    if (!window.confirm("Supprimer cet utilisateur ?")) return;
    fetch(`${apiUrl}/users/${id}`, {method: "DELETE", headers: authHeaders})
      .then(() => loadUsers())
      .catch(() => setError("Erreur lors de la suppression"));
  };

  const inputStyle = {flex:"1 1 140px",padding:"7px 10px",borderRadius:"7px",border:"1px solid var(--border)",background:"var(--card)",color:"var(--text)"};

  return (
    <div className="chart-card">
      <div className="cc-title">🛡️ Gestion des utilisateurs</div>
      <div className="cc-sub">{users.length} utilisateur{users.length>1?"s":""} enregistré{users.length>1?"s":""}</div>

      {error && <div className="login-error" style={{marginTop:"10px"}}><span>⚠️</span> {error}</div>}

      <form onSubmit={handleCreate} style={{display:"flex",flexWrap:"wrap",gap:"8px",margin:"14px 0",padding:"14px",background:"var(--bg)",borderRadius:"10px",border:"1.5px solid var(--border)"}}>
        <input required placeholder="Nom" value={form.nom} onChange={e=>setForm(f=>({...f,nom:e.target.value}))} style={inputStyle}/>
        <input placeholder="Prénom" value={form.prenom} onChange={e=>setForm(f=>({...f,prenom:e.target.value}))} style={inputStyle}/>
        <input required type="email" placeholder="Email" value={form.email} onChange={e=>setForm(f=>({...f,email:e.target.value}))} style={{...inputStyle,flexBasis:"180px"}}/>
        <input required type="password" placeholder="Mot de passe" value={form.motDePasse} onChange={e=>setForm(f=>({...f,motDePasse:e.target.value}))} style={inputStyle}/>
        <select value={form.role} onChange={e=>setForm(f=>({...f,role:e.target.value}))} style={inputStyle}>
          <option value="maraicher">Maraîcher</option>
          <option value="administrateur">Administrateur</option>
        </select>
        {form.role==="maraicher" && (
          <input placeholder="Exploitation" value={form.exploitation} onChange={e=>setForm(f=>({...f,exploitation:e.target.value}))} style={inputStyle}/>
        )}
        <button type="submit" disabled={creating} className="btn-login" style={{width:"auto",padding:"8px 16px",flex:"0 0 auto"}}>
          {creating ? "Création…" : "+ Ajouter"}
        </button>
      </form>

      {loading
        ? <div className="empty-box"><div className="e-icon">⏳</div><p>Chargement…</p></div>
        : users.length===0
        ? <div className="empty-box"><div className="e-icon">👤</div><p>Aucun utilisateur.</p></div>
        : <div className="tbl-scroll"><table>
            <thead><tr><th>Nom</th><th>Email</th><th>Rôle</th><th>Exploitation</th><th></th></tr></thead>
            <tbody>
              {users.map(u => (
                <tr key={u.idUtilisateur}>
                  <td className="td-bold">{u.prenom} {u.nom}</td>
                  <td>{u.email}</td>
                  <td><span className={`pill pill-${u.role==="administrateur"?"critical":"healthy"}`}>{u.role==="administrateur"?"🛡️ Admin":"🌾 Maraîcher"}</span></td>
                  <td style={{color:"var(--text3)"}}>{u.exploitation||"—"}</td>
                  <td>
                    {u.idUtilisateur!==currentUserId && (
                      <button onClick={()=>handleDelete(u.idUtilisateur)} style={{padding:"4px 10px",background:"#fee2e2",color:"#dc2626",border:"1.5px solid #fecaca",borderRadius:"7px",fontSize:"0.72rem",cursor:"pointer",fontWeight:700}}>
                        🗑 Supprimer
                      </button>
                    )}
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      }
    </div>
  );
}

/* ══════════════ APP ══════════════ */
function App() {
  const [showSplash, setShowSplash] = useState(true);
  const [authToken, setAuthToken] = useState(()=>localStorage.getItem('plantai_token')||sessionStorage.getItem('plantai_token')||"");
  const [userRole,  setUserRole]  = useState(()=>localStorage.getItem('plantai_role') ||sessionStorage.getItem('plantai_role') ||"");
  const [userIdCourant, setUserIdCourant] = useState(()=>localStorage.getItem('plantai_userId')||sessionStorage.getItem('plantai_userId')||"");
  const [isLoggedIn, setIsLoggedIn] = useState(()=>!!(localStorage.getItem('plantai_token')||sessionStorage.getItem('plantai_token')));
  const [userEmail,  setUserEmail]  = useState(()=>localStorage.getItem('plantai_email')||sessionStorage.getItem('plantai_email')||"");

  /* ── Connexion réelle : persiste le token JWT (localStorage si "se souvenir", sinon sessionStorage) ── */
  const handleLogin = (userData, remember) => {
    const store = remember ? localStorage : sessionStorage;
    store.setItem('plantai_token',  userData.token);
    store.setItem('plantai_role',   userData.role);
    store.setItem('plantai_userId', userData.idUtilisateur);
    store.setItem('plantai_email',  userData.email);
    setAuthToken(userData.token);
    setUserRole(userData.role);
    setUserIdCourant(userData.idUtilisateur);
    setUserEmail(userData.email);
    setIsLoggedIn(true);
  };

  const handleLogout = () => {
    localStorage.removeItem('plantai_token'); localStorage.removeItem('plantai_role');
    localStorage.removeItem('plantai_userId'); localStorage.removeItem('plantai_email');
    sessionStorage.removeItem('plantai_token'); sessionStorage.removeItem('plantai_role');
    sessionStorage.removeItem('plantai_userId'); sessionStorage.removeItem('plantai_email');
    setAuthToken(""); setUserRole(""); setUserIdCourant(""); setUserEmail(""); setIsLoggedIn(false);
  };

  const authHeaders = authToken ? {'Authorization': `Bearer ${authToken}`} : {};
  const [darkMode,  setDarkMode]   = useState(false);
  const [page,setPage]           = useState("dashboard");
  const [imageSrc,setImageSrc]   = useState(null);
  const [imageFile,setImageFile] = useState(null);
  const [fileName,setFileName]   = useState(null);
  const [loading,setLoading]     = useState(false);
  const [result,setResult]       = useState(null);
  const [history,setHistory]     = useState([]);
  const [dragOver,setDragOver]   = useState(false);
  const [now,setNow]             = useState(new Date());
  const fileRef = useRef();
  const {s:simSensors, hist:sHist} = useSensors();

  // ── État ESP32-CAM ────────────────────────────────────────────────────────
  const [histFilter,       setHistFilter]       = useState("all");
  const [esp32Ip,          setEsp32Ip]          = useState(()=>localStorage.getItem('esp32Ip')||'');
  const [esp32Connected,   setEsp32Connected]   = useState(false);
  const [esp32Checking,    setEsp32Checking]    = useState(false);
  const [esp32Mode,        setEsp32Mode]        = useState(false);  // false=upload true=cam
  const [esp32SettingsOpen,setEsp32SettingsOpen]= useState(false);
  const [esp32IpDraft,     setEsp32IpDraft]     = useState('');
  const [esp32TestMsg,     setEsp32TestMsg]     = useState(null);  // {ok,msg}
  const [esp32Testing,     setEsp32Testing]     = useState(false);

  // ── Capteurs IoT réels (ESP32 DHT11) — remplace la simulation si connecté ─
  const [realSensors,  setRealSensors]  = useState(null);
  const [sensorsReal,  setSensorsReal]  = useState(false); // true = données réelles
  useEffect(()=>{
    if (!esp32Connected || !esp32Ip) { setRealSensors(null); setSensorsReal(false); return; }
    const pull = () =>
      fetch(`${API_URL}/api/esp32/sensors?ip=${encodeURIComponent(esp32Ip)}`)
        .then(r=>r.ok?r.json():null)
        .then(d=>{
          if (d && d.ok && d.temp !== -1) {
            setRealSensors(p=>({
              temp:     typeof d.temp     === 'number' ? +d.temp.toFixed(1)     : (p?.temp     ?? simSensors.temp),
              humidity: typeof d.humidity === 'number' ? Math.round(d.humidity) : (p?.humidity ?? simSensors.humidity),
              soil:  p?.soil  ?? simSensors.soil,
            }));
            setSensorsReal(true);
          }
        })
        .catch(()=>{});
    pull();
    const id = setInterval(pull, 10000);
    return ()=>clearInterval(id);
  },[esp32Connected, esp32Ip]);
  const sensors = realSensors || simSensors;

  useEffect(()=>{ const id=setInterval(()=>setNow(new Date()),1000); return ()=>clearInterval(id); },[]);
  useEffect(()=>{ document.body.classList.toggle("dark", darkMode); },[darkMode]);

  // ── Chargement de l'historique depuis MongoDB au démarrage ───────────────
  // Authentifié → /history (analyses de l'utilisateur connecté, ou toutes si admin)
  // Sinon       → /api/history (legacy, non filtré) en repli
  useEffect(()=>{
    const loadHistory = async () => {
      try {
        const url = authToken ? `${API_URL}/history` : `${API_URL}/api/history`;
        const res = await fetch(url, authToken ? {headers: authHeaders} : undefined);
        if (!res.ok) return;
        const records = await res.json();
        if (!Array.isArray(records) || records.length === 0) return;
        setHistory(records.map(r => ({
          ...transformBackendResponse(r),
          id:     r.id  || r._id || Date.now(),
          dbId:   r._id || r.dbId || null,
          image:  (r.image && r.image.nomImage) || r.image || 'image.jpg',
          source: r.source,
          date:   new Date(r.date),
        })));
      } catch(e) {
        console.warn('Historique MongoDB non disponible:', e.message);
      }
    };
    loadHistory();
  }, [authToken]);

  // ── Polling ESP32 — vérification toutes les 5 secondes ───────────────────
  useEffect(()=>{
    if (!esp32Ip) { setEsp32Connected(false); return; }
    let cancelled = false;
    const check = async () => {
      try {
        const r = await fetch(`${API_URL}/api/esp32/status?ip=${encodeURIComponent(esp32Ip)}`);
        const d = await r.json();
        if (!cancelled) setEsp32Connected(!!d.connected);
      } catch { if (!cancelled) setEsp32Connected(false); }
    };
    check();
    const id = setInterval(check, 5000);
    return () => { cancelled = true; clearInterval(id); };
  }, [esp32Ip]);
  useEffect(()=>{
    if (!profileOpen) return;
    const close = (e) => { if (!e.target.closest(".nav-profile")) setProfileOpen(false); };
    document.addEventListener("mousedown", close);
    return () => document.removeEventListener("mousedown", close);
  },[profileOpen]);

  const total    = history.length;
  const healthy  = history.filter(h=>h.niveau==="healthy").length;
  const sick     = history.filter(h=>h.niveau==="sick").length;
  const critical = history.filter(h=>h.niveau==="critical").length;
  const avgConf  = total ? Math.round(history.reduce((a,b)=>a+b.score,0)/total) : 0;

  const diseaseMap = history.reduce((a,h)=>{a[h.maladie]=(a[h.maladie]||0)+1;return a;},{});
  const dL=Object.keys(diseaseMap), dV=Object.values(diseaseMap), dC=dL.map((_,i)=>COLORS[i%COLORS.length]);

  const loadImg = f => {
    if (!f?.type.startsWith("image/")) return;
    setImageFile(f); setFileName(f.name); setResult(null);
    const rd=new FileReader(); rd.onload=e=>setImageSrc(e.target.result); rd.readAsDataURL(f);
  };

  /* ── Test de connexion ESP32 depuis le modal ── */
  const testEsp32Connection = async () => {
    const ip = esp32IpDraft.trim();
    if (!ip) return;
    setEsp32Testing(true); setEsp32TestMsg(null);
    try {
      const r = await fetch(`${API_URL}/api/esp32/status?ip=${encodeURIComponent(ip)}`);
      const d = await r.json();
      if (d.connected) {
        setEsp32TestMsg({ok:true, msg:`ESP32-CAM connectée à ${ip} — Flux : :81/stream`});
        setEsp32Connected(true);
      } else {
        setEsp32TestMsg({ok:false, msg: d.message || `Hôte ${ip} inaccessible`});
        setEsp32Connected(false);
      }
    } catch(e) {
      setEsp32TestMsg({ok:false, msg:`Erreur réseau : ${e.message}`});
    } finally { setEsp32Testing(false); }
  };

  /* ── Logique partagée post-analyse ── */
  const _handleAnalysisResult = (data, imgName, srcTag) => {
    const now   = new Date();
    const entry = { id: Date.now(), image: imgName, ...data, date: now, source: srcTag };

    setResult(data);
    setHistory(p=>{
      const next=[entry,...p];
      if(next.length===1)  unlockAchievement('first_analysis',{icon:'🔬',title:'Première analyse !',desc:'1ère détection IA lancée.',xp:100});
      if(next.length===5)  unlockAchievement('five_analyses', {icon:'🏅',title:'5 analyses effectuées',desc:'Vous maîtrisez PlantAI !',xp:200});
      if(next.length===10) unlockAchievement('ten_analyses',  {icon:'⭐',title:'Analyste expert',desc:'10 analyses réalisées.',xp:500});
      if(next.length===50) unlockAchievement('fifty_analyses',{icon:'🏆',title:'Expert confirmé',desc:'50 analyses — impressionnant !',xp:1500});
      return next;
    });

    // ── Persistance MongoDB (fire-and-forget) ──────────────────────────────
    // Les analyses via /api/predict et /api/esp32/capture sont déjà auto-sauvegardées
    // côté backend. On ne renvoie que les analyses mock (source="mock") pour garder
    // une trace même hors connexion au modèle IA.
    if (srcTag === 'mock' && !data.dbId) {
      fetch(`${API_URL}/api/history`, {
        method:  'POST',
        headers: {'Content-Type':'application/json'},
        body:    JSON.stringify({...entry, date: now.toISOString()}),
      }).catch(()=>{});
    }

    if (data.niveau==="critical") { setAlertModal(data); setAlertBar(data); }
    else if (data.niveau==="sick")    showToast(`⚠️ Plante infectée : ${data.maladie} (${data.score}%)`,"error");
    else if (data.niveau==="healthy") {
      showToast(`✅ Plante saine — Confiance : ${data.score}%`,"success");
      fireConfetti();
      unlockAchievement('first_healthy',{icon:'🌿',title:'Plante saine !',desc:'Aucune maladie détectée.',xp:50});
    }
  };

  /* ── Analyse depuis upload fichier ── */
  const analyze = async () => {
    if (!imageFile) return;
    setLoading(true); setResult(null);
    try {
      const fd = new FormData(); fd.append("image", imageFile);
      const res = await fetch(`${API_URL}/api/predict`, { method:"POST", headers: authHeaders, body:fd });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const raw = await res.json();
      if (raw.error) throw new Error(raw.error);
      _handleAnalysisResult(transformBackendResponse(raw), fileName, "api");
    } catch(err) {
      console.warn("Backend inaccessible, mode démo :", err.message);
      await new Promise(r=>setTimeout(r,1400));
      const data = MOCK[Math.floor(Math.random()*MOCK.length)];
      _handleAnalysisResult(data, fileName, "mock");
    } finally { setLoading(false); }
  };

  /* ── Analyse depuis ESP32-CAM ── */
  const analyzeFromEsp32 = async () => {
    if (!esp32Ip) { setEsp32SettingsOpen(true); return; }
    setLoading(true); setResult(null);
    try {
      const res = await fetch(`${API_URL}/api/esp32/capture`, {
        method: 'POST',
        headers: {'Content-Type':'application/json', ...authHeaders},
        body: JSON.stringify({ip: esp32Ip}),
      });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const raw = await res.json();
      if (raw.error) throw new Error(raw.error);
      setFileName('ESP32-CAM');
      setImageSrc(null);
      _handleAnalysisResult(transformBackendResponse(raw), 'ESP32-CAM', 'esp32');
    } catch(err) {
      showToast(`❌ ESP32 erreur : ${err.message}`,"error");
      console.error("ESP32 capture error:", err);
    } finally { setLoading(false); }
  };

  /* Banner props */
  const healthColor = result
    ? (result.niveau==="healthy"?"green":result.niveau==="sick"?"orange":result.niveau==="unknown"?"":"red")
    : "green";
  const healthIcon  = result
    ? (result.niveau==="healthy"?"✅":result.niveau==="sick"?"⚠️":result.niveau==="unknown"?"❓":"🚨")
    : "⏳";
  const healthLabel = result ? result.maladie : "En attente…";
  const healthSub   = loading
    ? "Analyse en cours — modèle CNN"
    : result
      ? (result.niveau==="unknown"
          ? "⚠️ Espèce non reconnue — voir recommandation"
          : `Analysé · Confiance : ${result.score}%`)
      : "Soumettez une image pour démarrer";

  const TABS = [{id:"dashboard",label:"📊 Dashboard"},{id:"analyse",label:"🔍 Analyser"},{id:"history",label:"🗂️ Historique"},{id:"stats",label:"📈 Statistiques"},{id:"maladies",label:"🦠 Maladies"}]
    .concat(userRole==="administrateur" ? [{id:"users",label:"🛡️ Utilisateurs"}] : []);

  /* ── Mobile menu ── */
  const [menuOpen, setMenuOpen] = useState(false);
  const [cmdOpen,  setCmdOpen]  = useState(false);
  const [achievement, setAchievement] = useState(null);
  const achievedRef = useRef(new Set());
  const fireConfetti = triggerConfetti;
  const ticker = useTicker(result, esp32Connected);
  useScrollReveal(page);

  /* Ctrl+K command palette */
  useEffect(function(){
    var handler=function(e){
      if((e.ctrlKey||e.metaKey)&&e.key==='k'){e.preventDefault();setCmdOpen(function(o){return!o;});}
      if(e.key==='Escape')setCmdOpen(false);
    };
    window.addEventListener('keydown',handler);
    return function(){window.removeEventListener('keydown',handler);};
  },[]);

  /* Achievement trigger */
  var unlockAchievement = function(id, data) {
    if(achievedRef.current.has(id))return;
    achievedRef.current.add(id);
    setAchievement(data);
    setTimeout(function(){setAchievement(null);},5000);
  };

  /* Ambient glow color based on health */
  var ambientColor = result
    ? (result.niveau==='healthy'?'rgba(29,185,84,0.15)':result.niveau==='critical'?'rgba(239,68,68,0.15)':'rgba(245,158,11,0.12)')
    : 'rgba(29,185,84,0.08)';


  /* ── Profil ── */
  const [profileOpen, setProfileOpen] = useState(false);
  const userName   = userEmail ? userEmail.split("@")[0].replace(/[._]/g," ").replace(/\b\w/g,c=>c.toUpperCase()) : "Étudiant";
  const userInitials = userName.split(" ").map(w=>w[0]).join("").slice(0,2).toUpperCase();
  const loginTime  = useRef(new Date());

  /* ── Export PDF ── */
  const [pdfLoading, setPdfLoading] = useState(false);
  const [toast, setToast]           = useState(null);
  const [alertModal, setAlertModal] = useState(null);
  const [alertBar,   setAlertBar]   = useState(null);
  const alertCount = history.filter(h=>h.niveau==="critical").length;

  // Annotations
  const [noteModal,  setNoteModal]  = useState(null);   // {id, maladie, date, note}
  const [noteDraft,  setNoteDraft]  = useState("");
  const [malOpen,    setMalOpen]    = useState({});      // page "Maladies" : cultures dépliées

  // ── Catalogue "recommandations" depuis le backend (reflète le modèle CNN réellement chargé) ──
  const [catalogue, setCatalogue] = useState([]);
  useEffect(() => {
    fetch(`${API_URL}/recommandations`)
      .then(r => r.ok ? r.json() : [])
      .then(data => setCatalogue(Array.isArray(data) ? data : []))
      .catch(() => setCatalogue([]));
  }, []);

  const openNote = (h) => { setNoteModal(h); setNoteDraft(h.note||""); };
  const saveNote = () => {
    setHistory(p => p.map(h => h.id===noteModal.id ? {...h, note: noteDraft.trim()} : h));
    showToast("📝 Note enregistrée !");
    setNoteModal(null);
  };
  const deleteNote = () => {
    setHistory(p => p.map(h => h.id===noteModal.id ? {...h, note:""} : h));
    showToast("🗑 Note supprimée");
    setNoteModal(null);
  };

  const showToast = (msg, type="success") => {
    setToast({msg, type});
    setTimeout(() => setToast(null), 3500);
  };

  const exportPDF = () => {
    const { jsPDF } = window.jspdf;
    if (!jsPDF) { showToast("jsPDF non disponible", "error"); return; }
    setPdfLoading(true);
    try {
      const doc = new jsPDF({ orientation:"portrait", unit:"mm", format:"a4" });
      const W = doc.internal.pageSize.getWidth();
      let y = 0;

      /* ── En-tête vert ── */
      doc.setFillColor(29, 185, 84);
      doc.rect(0, 0, W, 38, "F");
      doc.setFillColor(13, 110, 46);
      doc.rect(0, 32, W, 6, "F");

      doc.setTextColor(255, 255, 255);
      doc.setFontSize(20); doc.setFont("helvetica","bold");
      doc.text("PlantAI — Student Plant Monitor", 14, 16);
      doc.setFontSize(9); doc.setFont("helvetica","normal");
      doc.text("Rapport de détection des maladies des plantes · Projet Tutoré 2026", 14, 24);
      doc.text(`Généré le : ${new Date().toLocaleDateString("fr-FR",{weekday:"long",day:"2-digit",month:"long",year:"numeric",hour:"2-digit",minute:"2-digit"})}`, 14, 31);
      y = 50;

      /* ── Section KPI ── */
      doc.setTextColor(15, 23, 42);
      doc.setFontSize(12); doc.setFont("helvetica","bold");
      doc.text("Résumé des Analyses", 14, y); y += 8;

      const kpis = [
        {label:"Total Analyses", val:String(total),   color:[29,185,84]},
        {label:"Plantes Saines", val:String(healthy),  color:[22,163,74]},
        {label:"Infectées",      val:String(sick),     color:[245,158,11]},
        {label:"Critiques",      val:String(critical), color:[239,68,68]},
      ];
      const bw = (W - 28 - 9) / 4;
      kpis.forEach((k, i) => {
        const x = 14 + i*(bw+3);
        doc.setFillColor(...k.color);
        doc.roundedRect(x, y, bw, 20, 3, 3, "F");
        doc.setTextColor(255,255,255);
        doc.setFontSize(18); doc.setFont("helvetica","bold");
        doc.text(k.val, x + bw/2, y+13, {align:"center"});
        doc.setFontSize(7); doc.setFont("helvetica","normal");
        doc.text(k.label, x + bw/2, y+19, {align:"center"});
      });
      y += 30;

      /* ── Capteurs ── */
      doc.setTextColor(15, 23, 42);
      doc.setFontSize(12); doc.setFont("helvetica","bold");
      doc.text("État des Capteurs ESP32 (Valeurs actuelles)", 14, y); y += 8;

      const sensorData = [
        ["Temperature",   `${sensors.temp} deg C`,   sensors.temp < 18?"Froid":sensors.temp>32?"Chaud":"Normal"],
        ["Humidite air",  `${sensors.humidity} %`,   sensors.humidity<40?"Sec":sensors.humidity>80?"Sature":"Normal"],
        ["Humidite sol",  `${sensors.soil} %`,       sensors.soil<40?"Sec":sensors.soil>75?"Sature":"Normal"],
      ];
      doc.autoTable({
        startY: y,
        head: [["Capteur","Valeur","Statut"]],
        body: sensorData,
        theme: "grid",
        headStyles: { fillColor:[29,185,84], textColor:255, fontStyle:"bold", fontSize:9 },
        bodyStyles: { fontSize:9, textColor:[15,23,42] },
        alternateRowStyles: { fillColor:[232,248,237] },
        margin: { left:14, right:14 },
        tableWidth: W - 28,
      });
      y = doc.lastAutoTable.finalY + 12;

      /* ── Dernier diagnostic ── */
      if (result) {
        doc.setFontSize(12); doc.setFont("helvetica","bold"); doc.setTextColor(15,23,42);
        doc.text("Dernier Diagnostic IA", 14, y); y += 8;
        const statusColor = result.niveau==="healthy"?[29,185,84]:result.niveau==="sick"?[245,158,11]:[239,68,68];
        doc.setFillColor(...statusColor);
        doc.roundedRect(14, y, W-28, 18, 3, 3, "F");
        doc.setTextColor(255,255,255);
        doc.setFontSize(13); doc.setFont("helvetica","bold");
        doc.text(result.maladie, 20, y+8);
        doc.setFontSize(9); doc.setFont("helvetica","normal");
        doc.text(`Confiance : ${result.score}%  ·  Statut : ${result.niveau==="healthy"?"Saine":result.niveau==="sick"?"Infectée":"Critique"}`, 20, y+15);
        y += 26;
        if (result.conseil) {
          doc.setTextColor(13,110,46); doc.setFontSize(9); doc.setFont("helvetica","italic");
          doc.text(`Conseil : ${result.conseil}`, 14, y, {maxWidth: W-28}); y += 14;
        }
      }

      /* ── Historique ── */
      if (history.length > 0) {
        doc.setFontSize(12); doc.setFont("helvetica","bold"); doc.setTextColor(15,23,42);
        doc.text("Historique des Analyses", 14, y); y += 6;
        doc.autoTable({
          startY: y,
          head: [["#","Image","Maladie détectée","Confiance","Statut","Date","Note"]],
          body: history.map((h,i) => [
            String(history.length-i),
            h.image||"image.jpg",
            h.maladie,
            `${h.score}%`,
            h.niveau==="healthy"?"Saine":h.niveau==="sick"?"Infectee":"Critique",
            h.date.toLocaleDateString("fr-FR",{day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"}),
            h.note||"—",
          ]),
          theme: "striped",
          headStyles: { fillColor:[15,23,42], textColor:255, fontStyle:"bold", fontSize:8 },
          bodyStyles: { fontSize:8 },
          alternateRowStyles: { fillColor:[247,249,252] },
          margin: { left:14, right:14 },
          tableWidth: W-28,
          didParseCell: (data) => {
            if (data.section==="body" && data.column.index===4) {
              const v = data.cell.raw;
              if (v.includes("Saine"))    data.cell.styles.textColor = [22,163,74];
              if (v.includes("Infectée")) data.cell.styles.textColor = [217,119,6];
              if (v.includes("Critique")) data.cell.styles.textColor = [220,38,38];
            }
          }
        });
      }

      /* ── Pied de page ── */
      const pages = doc.internal.getNumberOfPages();
      for (let i=1; i<=pages; i++) {
        doc.setPage(i);
        doc.setFontSize(8); doc.setTextColor(148,163,184); doc.setFont("helvetica","normal");
        doc.text(`PlantAI · Projet Tutoré 2026 · Page ${i}/${pages}`, W/2, doc.internal.pageSize.getHeight()-8, {align:"center"});
        doc.setDrawColor(229,231,235); doc.line(14, doc.internal.pageSize.getHeight()-12, W-14, doc.internal.pageSize.getHeight()-12);
      }

      doc.save(`PlantAI_Rapport_${new Date().toLocaleDateString("fr-FR").replace(/\//g,"-")}.pdf`);
      showToast("✅ Rapport PDF téléchargé !");
    } catch(e) {
      showToast("❌ Erreur lors de la génération du PDF", "error");
    } finally {
      setPdfLoading(false);
    }
  };

  /* Splash screen au démarrage */
  if (showSplash) return <SplashScreen onDone={()=>setShowSplash(false)}/>;

  /* Page de connexion */
  if (!isLoggedIn) return <LoginPage onLogin={handleLogin}/>;

  return (<div className="dashboard-enter">
    {/* ═══ GLOBAL EFFECTS ═══ */}
    <CursorTrail/>
    {/* Ambient glow */}
    <div className="ambient-glow g1" style={{background:ambientColor}}/>
    <div className="ambient-glow g2" style={{background:ambientColor,opacity:0.6}}/>
    {/* Command Palette */}
    {cmdOpen && <CommandPalette
      onClose={function(){setCmdOpen(false);}}
      onNavigate={function(p){setPage(p);}}
      history={history}
      darkMode={darkMode}
      onToggleDark={function(){setDarkMode(function(d){return!d;});}}
    />}
    {/* Achievement Toast */}
    {achievement && <AchievementToast data={achievement} onDone={function(){setAchievement(null);}}/>}

    {/* ══ NAVBAR ══ */}
    <nav className="navbar">
      <div className="nav-brand">
        <div className="nav-logo">🌿</div>
        <div>
          <div className="nav-title">Student Plant Monitor</div>
          <div className="nav-subtitle">Détection intelligente des maladies</div>
        </div>
      </div>
      {/* Hamburger mobile */}
      <button className={`nav-hamburger ${menuOpen?"open":""}`} onClick={()=>setMenuOpen(p=>!p)} aria-label="Menu">
        <span/><span/><span/>
      </button>

      <div className="nav-sep"/>
      <div className="nav-tabs">
        {TABS.map(t=>(
          <button key={t.id} className={`nav-tab ${page===t.id?"active":""}`} onClick={()=>setPage(t.id)}>{t.label}</button>
        ))}
      </div>
      <div
        className={`esp32-badge ${esp32Ip ? (esp32Connected ? 'connected' : 'disconnected') : 'unconfigured'}`}
        onClick={()=>{ setEsp32IpDraft(esp32Ip); setEsp32TestMsg(null); setEsp32SettingsOpen(true); }}
        title="Cliquez pour configurer l'ESP32-CAM"
      >
        <span className={`esp32-dot ${esp32Ip?(esp32Connected?'on':'off'):'grey'}`}/>
        📷 ESP32-CAM — {esp32Ip ? (esp32Connected ? 'Connectée' : 'Hors ligne') : 'Configurer'}
      </div>
      <div className="live-ticker">
        <span className="ticker-dot"/>
        <span key={ticker.tick} className="ticker-text">{ticker.msg}</span>
      </div>

      {/* Badge alertes critiques */}
      {alertCount > 0 && (
        <div className="nav-badge" style={{background:"rgba(239,68,68,0.12)",borderColor:"#fca5a5",color:"#dc2626",cursor:"pointer"}}
          onClick={()=>setPage("history")}>
          🚨 Alertes <span className="alert-badge">{alertCount}</span>
        </div>
      )}

      <button className="btn-pdf" onClick={function(){setCmdOpen(true);}} style={{background:"linear-gradient(135deg,#3b82f6,#1d4ed8)",boxShadow:"0 2px 8px rgba(59,130,246,0.3)"}}>
        ⌕ Commandes <span style={{opacity:0.7,fontSize:"0.65rem",marginLeft:"2px"}}>Ctrl+K</span>
      </button>
      <button className="btn-pdf" onClick={exportPDF} disabled={pdfLoading}>
        {pdfLoading ? "⏳ Génération..." : "📄 Exporter PDF"}
      </button>
      <div className="nav-time">{fmtTime(now)}</div>

      {/* Bouton dark mode */}
      <button className="btn-theme" onClick={()=>setDarkMode(p=>!p)} title={darkMode?"Mode clair":"Mode sombre"}>
        {darkMode ? "☀️" : "🌙"}
      </button>

      {/* ── Profil utilisateur ── */}
      <div className="nav-profile">
        <button className="nav-profile-btn" onClick={()=>setProfileOpen(p=>!p)}>
          <div className="nav-avatar">{userInitials}</div>
          <div style={{textAlign:"left"}}>
            <div className="nav-profile-name">{userName}</div>
            <div className="nav-profile-role">{userRole==="administrateur" ? "🛡️ Administrateur" : userRole==="maraicher" ? "🌾 Maraîcher" : "Étudiant IoT"}</div>
          </div>
          <span className={`nav-chevron ${profileOpen?"open":""}`}>▼</span>
        </button>

        {profileOpen && (
          <div className="profile-dropdown">
            {/* En-tête vert */}
            <div className="pd-header">
              <div className="pd-avatar-lg">{userInitials}</div>
              <div>
                <div className="pd-name">{userName}</div>
                <div className="pd-email">{userEmail}</div>
                <span className="pd-role-badge">{userRole==="administrateur" ? "🛡️ Administrateur" : userRole==="maraicher" ? "🌾 Maraîcher" : "🎓 Projet Tutoré 2026"}</span>
              </div>
            </div>

            {/* Stats rapides */}
            <div className="pd-stats">
              <div>
                <div className="pd-stat-val">{total}</div>
                <div className="pd-stat-label">Analyses</div>
              </div>
              <div>
                <div className="pd-stat-val" style={{color:"#1db954"}}>{healthy}</div>
                <div className="pd-stat-label">Saines</div>
              </div>
              <div>
                <div className="pd-stat-val" style={{color:"#ef4444"}}>{critical}</div>
                <div className="pd-stat-label">Critiques</div>
              </div>
            </div>

            <div className="pd-body">
              <div className="pd-item" onClick={()=>{ setProfileOpen(false); setPage("dashboard"); }}>
                <span className="pd-item-icon">📊</span> Dashboard
              </div>
              <div className="pd-item" onClick={()=>{ setProfileOpen(false); setPage("history"); }}>
                <span className="pd-item-icon">🗂️</span> Historique des analyses
              </div>
              <div className="pd-item" onClick={()=>{ setDarkMode(p=>!p); setProfileOpen(false); }}>
                <span className="pd-item-icon">{darkMode?"☀️":"🌙"}</span>
                {darkMode ? "Mode clair" : "Mode sombre"}
              </div>
              <div className="pd-sep"/>
              <div className="pd-item" style={{fontSize:"0.75rem",color:"var(--text3)",cursor:"default",pointerEvents:"none"}}>
                <span className="pd-item-icon">⏱️</span>
                Connecté depuis {Math.round((new Date()-loginTime.current)/60000)||"<1"} min
              </div>
              <div className="pd-sep"/>
              <div className="pd-item danger" onClick={()=>{ setProfileOpen(false); handleLogout(); }}>
                <span className="pd-item-icon">🚪</span> Se déconnecter
              </div>
            </div>
          </div>
        )}
      </div>
    </nav>

    {/* ═══ KEYBOARD HINT BAR ═══ */}
    <div className="kb-bar">
      <span><kbd>Ctrl</kbd>+<kbd>K</kbd> Palette de commandes</span>
      <span className="kb-bar-sep">·</span>
      <span><kbd>Ctrl</kbd>+<kbd>D</kbd> Dark mode</span>
      <span className="kb-bar-sep">·</span>
      <span><kbd>Ctrl</kbd>+<kbd>P</kbd> Exporter PDF</span>
      <span style={{marginLeft:"auto",color:"var(--green-dark)",fontWeight:700}}>PlantAI v2.0 · ESP32-CAM · CNN · FastAPI</span>
    </div>

    {/* ══ MENU MOBILE ══ */}
    <div className={`mobile-menu ${menuOpen?"open":""}`}>
      {TABS.map(t=>(
        <button key={t.id} className={`mobile-tab ${page===t.id?"active":""}`}
          onClick={()=>{ setPage(t.id); setMenuOpen(false); }}>
          {t.label}
        </button>
      ))}
      <div className="mobile-menu-sep"/>
      <div className="mobile-menu-row">
        <button className="mobile-tab" onClick={()=>{ setDarkMode(p=>!p); setMenuOpen(false); }}>
          {darkMode?"☀️ Mode clair":"🌙 Mode sombre"}
        </button>
        <button className="mobile-tab" style={{color:"#dc2626"}}
          onClick={()=>{ setMenuOpen(false); exportPDF(); }}>
          📄 PDF
        </button>
      </div>
      <div className="mobile-menu-sep"/>
      <button className="mobile-tab" style={{color:"#dc2626"}}
        onClick={()=>{ setMenuOpen(false); handleLogout(); }}>
        🚪 Se déconnecter
      </button>
    </div>

    {/* Barre d'alerte sticky */}
    {alertBar && (
      <div className="alert-bar">
        <span>🚨</span>
        <strong>ALERTE CRITIQUE</strong> — {alertBar.maladie} détectée avec {alertBar.score}% de confiance. Action immédiate requise !
        <button className="alert-bar-close" onClick={()=>setAlertBar(null)}>✕ Fermer</button>
      </div>
    )}

    {/* Modal alerte critique */}
    {alertModal && (
      <div className="alert-overlay" onClick={()=>setAlertModal(null)}>
        <div className="alert-modal" onClick={e=>e.stopPropagation()}>
          <div className={`alert-header ${alertModal.niveau}`}>
            <div className="alert-icon-wrap">🚨</div>
            <div className="alert-header-text">
              <h3>ALERTE — Maladie Critique Détectée !</h3>
              <p>Le modèle IA a identifié une pathologie sévère nécessitant une intervention immédiate.</p>
            </div>
          </div>
          <div className="alert-body">
            <div className="alert-disease">
              {alertModal.maladie}
            </div>
            <div className="alert-conf">
              Confiance du modèle :
              <div className="alert-conf-bar">
                <div className="alert-conf-fill" style={{width:`${alertModal.score}%`, background:"#ef4444"}}/>
              </div>
              <strong style={{color:"#ef4444"}}>{alertModal.score}%</strong>
            </div>
            {alertModal.conseil && (
              <div className={`alert-conseil ${alertModal.niveau}`}>
                ⚠️ <strong>Action recommandée :</strong> {alertModal.conseil}
              </div>
            )}
            <div className="alert-actions">
              <button className="alert-btn-dismiss" onClick={()=>setAlertModal(null)}>
                Ignorer
              </button>
              <button className="alert-btn-view" onClick={()=>{setAlertModal(null);setPage("history");}}>
                📋 Voir l'historique
              </button>
            </div>
          </div>
        </div>
      </div>
    )}

    {/* Modal annotation */}
    {noteModal && (
      <div className="note-modal-overlay" onClick={()=>setNoteModal(null)}>
        <div className="note-modal" onClick={e=>e.stopPropagation()}>
          <div className="note-modal-head">
            <div>
              <div className="note-modal-title">📝 Annoter l'analyse</div>
              <div className="note-modal-sub">Ajoute une note personnelle sur ce résultat</div>
            </div>
            <button className="note-modal-close" onClick={()=>setNoteModal(null)}>✕</button>
          </div>
          <div className="note-modal-body">
            <div className="note-disease-info">
              <span className="note-disease-icon">
                {noteModal.niveau==="healthy"?"✅":noteModal.niveau==="sick"?"⚠️":"🚨"}
              </span>
              <div>
                <div className="note-disease-name">{noteModal.maladie}</div>
                <div className="note-disease-date">{fmtFull(noteModal.date)} · Confiance : {noteModal.score}%</div>
              </div>
            </div>
            <textarea
              className="note-textarea"
              placeholder="Ex : Feuille prélevée dans la parcelle B3 — traitement au cuivre appliqué le lendemain..."
              value={noteDraft}
              onChange={e=>setNoteDraft(e.target.value.slice(0,300))}
              autoFocus
            />
            <div className="note-char-count">{noteDraft.length} / 300 caractères</div>
            <div className="note-actions">
              {noteModal.note && (
                <button className="note-btn-cancel" style={{color:"#dc2626",borderColor:"#fca5a5"}} onClick={deleteNote}>
                  🗑 Supprimer
                </button>
              )}
              <button className="note-btn-cancel" onClick={()=>setNoteModal(null)}>Annuler</button>
              <button className="note-btn-save" onClick={saveNote} disabled={!noteDraft.trim()}>
                💾 Enregistrer
              </button>
            </div>
          </div>
        </div>
      </div>
    )}

    {/* Toast */}
    {toast && <div className={`toast ${toast.type}`}>{toast.msg}</div>}

    {/* ══ MODAL CONFIG ESP32-CAM ══ */}
    {esp32SettingsOpen && (
      <div className="esp32-modal-overlay" onClick={()=>setEsp32SettingsOpen(false)}>
        <div className="esp32-modal" onClick={e=>e.stopPropagation()}>
          <div className="esp32-modal-head">
            <div className="esp32-modal-icon">📷</div>
            <div>
              <div className="esp32-modal-title">Configuration ESP32-CAM</div>
              <div className="esp32-modal-sub">Entrez l'adresse IP locale de votre caméra ESP32</div>
            </div>
            <button className="esp32-modal-close" onClick={()=>setEsp32SettingsOpen(false)}>✕</button>
          </div>

          <div className="esp32-modal-body">
            <div className="esp32-label">Adresse IP de l'ESP32-CAM</div>
            <div className="esp32-input-wrap">
              <input
                className="esp32-ip-input"
                type="text"
                placeholder="ex : 192.168.1.42"
                value={esp32IpDraft}
                onChange={e=>{ setEsp32IpDraft(e.target.value); setEsp32TestMsg(null); }}
                onKeyDown={e=>{ if(e.key==='Enter') testEsp32Connection(); }}
                autoFocus
              />
              <button
                className="esp32-btn-test"
                onClick={testEsp32Connection}
                disabled={!esp32IpDraft.trim()||esp32Testing}
              >
                {esp32Testing ? "⏳ Test…" : "🔌 Tester"}
              </button>
            </div>

            {esp32TestMsg && (
              <div className={`esp32-status-line ${esp32TestMsg.ok?"ok":"err"}`}>
                {esp32TestMsg.ok ? "✅" : "❌"} {esp32TestMsg.msg}
              </div>
            )}

            <div className="esp32-hints">
              <strong>Comment trouver l'IP de l'ESP32 ?</strong><br/>
              1. L'ESP32 affiche son IP sur le <strong>port série</strong> (Arduino Monitor)<br/>
              2. Cherchez dans <code>192.168.x.x</code> sur votre routeur (DHCP)<br/>
              3. Assurez-vous que l'ESP32 et votre PC sont sur le <strong>même réseau WiFi</strong><br/><br/>
              <strong>Endpoints ESP32-CAM attendus :</strong><br/>
              • <code>http://&lt;IP&gt;/capture</code> — capture JPEG<br/>
              • <code>http://&lt;IP&gt;:81/stream</code> — flux MJPEG live
            </div>
          </div>

          <div className="esp32-modal-footer">
            <button className="esp32-btn-cancel" onClick={()=>setEsp32SettingsOpen(false)}>Annuler</button>
            {esp32Ip && (
              <button className="esp32-btn-cancel" style={{color:"#dc2626",borderColor:"#fca5a5"}}
                onClick={()=>{ setEsp32Ip(''); localStorage.removeItem('esp32Ip'); setEsp32SettingsOpen(false); setEsp32Connected(false); showToast("🔌 ESP32 déconnectée"); }}>
                Déconnecter
              </button>
            )}
            <button
              className="esp32-btn-save"
              disabled={!esp32IpDraft.trim()}
              onClick={()=>{
                const ip = esp32IpDraft.trim();
                setEsp32Ip(ip);
                localStorage.setItem('esp32Ip', ip);
                setEsp32SettingsOpen(false);
                showToast(`📷 ESP32 configurée : ${ip}`,"success");
              }}
            >
              💾 Enregistrer
            </button>
          </div>
        </div>
      </div>
    )}

    {/* Particules arrière-plan */}
    <ParticleField/>

    {/* ══ PAGE ══ */}
    <div className="page">

      {/* ════ DASHBOARD ════ */}
      {page==="dashboard" && <>

        {/* ── Cultivateur animé ── */}
        <FarmerAvatar result={result} loading={loading}/>

        {/* Hero banners */}
        <div className="section-title">État de la Plante</div>
        <div className="hero-grid" style={{marginBottom:"20px"}}>

          {/* Plant Health */}
          <TiltCard className={`hero-banner ${healthColor}`}>
            <div className="hb-bg-circle c1"/><div className="hb-bg-circle c2"/>
            <div className="hb-label"><span className="pulse-dot" style={{background:"rgba(255,255,255,0.8)"}}/> PLANT HEALTH</div>
            <div className="hb-value">{loading?"Processing…":healthLabel}</div>
            <div className="hb-sub">{healthSub}</div>
            <div className="hb-pill">
              {healthIcon} {result?(result.niveau==="healthy"?"Saine":result.niveau==="sick"?"Infectée":result.niveau==="unknown"?"Non reconnue":"Critique"):"En attente"}
            </div>
            {result && (
              <div className="hb-conf">
                <div className="hb-conf-val"><AnimatedNumber value={result.score} suffix="%" decimals={0}/></div>
                <div className="hb-conf-label">Confidence IA</div>
              </div>
            )}
          </TiltCard>

          {/* Soil + Temp side */}
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"16px"}}>
            <TiltCard className="hero-banner teal">
              <div className="hb-bg-circle c1"/><div className="hb-bg-circle c2"/>
              <div className="hb-label">💧 SOIL MOIST</div>
              <div className="hb-value"><AnimatedNumber value={sensors.soil} suffix="%" decimals={0}/></div>
              <div className="hb-sub">{sensors.soil<40?"Sol trop sec":sensors.soil>75?"Sol saturé":"Humidité optimale"}</div>
              <div className="hb-pill">🌱 Capteur sol</div>
            </TiltCard>
            <TiltCard className="hero-banner orange">
              <div className="hb-bg-circle c1"/><div className="hb-bg-circle c2"/>
              <div className="hb-label">🌡️ TEMPÉRATURE</div>
              <div className="hb-value"><AnimatedNumber value={sensors.temp} suffix="°C" decimals={1}/></div>
              <div className="hb-sub">{sensors.temp<18?"Trop froid":sensors.temp>32?"Trop chaud":"Température idéale"}</div>
              <div className="hb-pill">{sensorsReal?"🌡️ DHT11 LIVE":"🌡️ DHT11 (sim)"}</div>
            </TiltCard>
            <TiltCard className="hero-banner" style={{background:"linear-gradient(135deg,#8b5cf6,#6d28d9)",boxShadow:"0 8px 32px rgba(139,92,246,0.22)"}}>
              <div className="hb-bg-circle c1"/><div className="hb-bg-circle c2"/>
              <div className="hb-label">💧 HUMIDITÉ AIR</div>
              <div className="hb-value"><AnimatedNumber value={sensors.humidity} suffix="%" decimals={0}/></div>
              <div className="hb-sub">{sensors.humidity<40?"Air sec":sensors.humidity>80?"Trop humide":"Humidité correcte"}</div>
              <div className="hb-pill">{sensorsReal?"🌫️ DHT11 LIVE":"🌫️ DHT11 (sim)"}</div>
            </TiltCard>
          </div>
        </div>

        {/* Sparklines row — style image */}
        <div className="section-title">Tendances Capteurs</div>
        <div className="charts-row fade-in-up">
          <div className="chart-card">
            <div className="cc-head">
              <div className="cc-title">📈 Activité Multi-Capteurs</div>
              <div className="cc-period">Live</div>
            </div>

            {icon:"🚨",bg:"#fee2e2",color:"#dc2626",val:critical, label:"Critiques",      trend:`Conf. moy. ${avgConf}%`,dir:critical?"down":"flat"},

              </div>

        {total===0 ? (
          <div className="chart-card">
            <div className="empty-box">

              <p style={{fontSize:"0.88rem",marginBottom:"4px"}}>Aucune analyse disponible.</p>

            </div>
          </div>
        ) : (

      {/* ════ ANALYSER ════ */}

                <input type="file" accept="image/*" ref={fileRef} onChange={e=>loadImg(e.target.files[0])}/>
                {imageSrc
                  ? <div className={loading?"scan-wrap":""}>
                      <img src={imageSrc} className="preview-img" alt="Aperçu" style={{display:"block",width:"100%"}}/>
                      {loading && <>
                        <div className="scan-beam"/><div className="scan-grid"/>
                        <div className="scan-corner tl"/><div className="scan-corner tr"/>

                        <div className="scan-label">⬛ SCANNING… IA INFERENCE</div>

                  : <><div className="uz-icon">🍃</div><div className="uz-text"><p><strong>Glissez-déposez</strong> ou <strong>cliquez</strong><br/>pour sélectionner une image<br/><span style={{fontSize:"0.72rem",color:"#94a3b8"}}>JPG · PNG · WEBP</span></p></div></>

              <button className="btn-primary" onClick={analyze} disabled={!imageSrc||loading}>

            {/* ── MODE ESP32-CAM ── */}
            {esp32Mode && <>

                      <img

                border: `1px solid ${esp32Connected?"#86efac":"#fca5a5"}`,
                fontSize:"0.76rem",fontWeight:700,
                color: esp32Connected?"#16a34a":"#dc2626"

                <span style={{
                  width:"8px",height:"8px",borderRadius:"50%",flexShrink:0,
                  background: esp32Connected?"#1db954":"#ef4444",

                {esp32Connected
                  ? `✓ ESP32-CAM connectée · ${esp32Ip} · Prête`

                  <button
                    onClick={()=>{ setEsp32IpDraft(''); setEsp32TestMsg(null); setEsp32SettingsOpen(true); }}

                  </button>

              </div>

              {/* Bouton capturer */}
              <button
                className="btn-capture"
                onClick={analyzeFromEsp32}
                disabled={loading}
              >
                {loading
                  ? <><div className="spinner" style={{width:"18px",height:"18px",borderWidth:"2px",borderColor:"rgba(255,255,255,0.3)",borderTopColor:"#fff"}}/>Analyse en cours…</>
                  : <><span style={{fontSize:"1.1rem"}}>📸</span> Capturer &amp; Analyser</>
                }
              </button>

              <p style={{fontSize:"0.68rem",color:"var(--text3)",marginTop:"8px",textAlign:"center",lineHeight:1.5}}>
                Capture une photo instantanée depuis l'ESP32-CAM<br/>et lance l'analyse IA automatiquement.
              </p>
            </>}
          </div>

          {/* ── Panneau droit : résultat IA ── */}
          <div className="chart-card">
            <div className="cc-title" style={{marginBottom:"4px"}}>🧠 Diagnostic IA</div>
            <div className="cc-sub">
              Modèle : CNN Keras (MobileNetV2) — {catalogue.length ? `${catalogue.length + new Set(catalogue.map(r=>r.plante).filter(Boolean)).size} classes` : "catalogue…"}
              {result?.label && <span style={{marginLeft:"6px",fontSize:"0.65rem",background:"#dcfce7",color:"#16a34a",borderRadius:"4px",padding:"1px 6px",fontWeight:700}}>CNN Keras</span>}
            </div>

            {!result&&!loading && <div className="result-idle"><Leaf3D niveau={null}/><p style={{marginTop:"6px"}}>Soumettez une image<br/>ou capturez depuis l'ESP32<br/>pour obtenir le diagnostic.</p></div>}
            {loading && (
              <div className="result-idle">

            {result&&!loading && (

                        <div style={{background:"var(--green-pale)",border:"1.5px solid #a7f3c3",borderRadius:"12px",padding:"12px 14px",fontSize:"0.76rem",color:"var(--green-deep)",lineHeight:1.7}}>
                          {(() => {
                            const cultures = [...new Set(catalogue.map(r=>r.plante).filter(Boolean))];

                        <div className="rc-row">
                          <span className="rc-lbl">Statut phytosanitaire</span>

      {/* ════ HISTORIQUE ════ */}

          try { await fetch(`${API_URL}/api/history`, {method:'DELETE'}); } catch(e){}

        const filterBtns = [
          {key:"all",      label:`Toutes (${history.length})`,                                              color:"#6366f1"},
          {key:"healthy",  label:`✅ Saines (${history.filter(h=>h.niveau==="healthy").length})`,           color:"#16a34a"},
          {key:"sick",     label:`⚠️ Infectées (${history.filter(h=>h.niveau==="sick").length})`,           color:"#f59e0b"},

          <div className="chart-card">
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"4px"}}>
              <div className="cc-title">🗂️ Historique des Analyses</div>

            <div className="cc-sub">{total} analyse{total>1?"s":""} enregistrée{total>1?"s":""} — persisté en base de données</div>

                    padding:"4px 11px",fontSize:"0.72rem",fontWeight:700,cursor:"pointer",
                    borderRadius:"20px",border:`1.5px solid ${histFilter===key?color:"var(--border)"}`,

            {total===0
              ? <div className="empty-box"><div className="e-icon">📭</div><p>Aucune analyse.<br/><span className="e-link" onClick={()=>setPage("analyse")}>→ Lancer une analyse</span></p></div>

              ? <div className="empty-box"><div className="e-icon">🔍</div><p>Aucune analyse dans cette catégorie.</p></div>
              : <div className="tbl-scroll"><table>

                        <td className="td-bold">{h.maladie}</td>
                        <td>
                          <span style={{color:bcolor(h.niveau),fontWeight:800}}>{h.score}%</span>

                        <td><span className={`pill pill-${h.niveau}`}>{h.niveau==="healthy"?"✅ Saine":h.niveau==="sick"?"⚠️ Infectée":h.niveau==="unknown"?"❓ Non reconnue":"🚨 Critique"}</span></td>
                        <td style={{color:"var(--text3)",fontSize:"0.72rem"}}>{fmtFull(h.date instanceof Date ? h.date : new Date(h.date))}</td>

                          <button className={`btn-note ${h.note?"has-note":""}`} onClick={()=>openNote(h)}>
                            {h.note ? "✏️ Voir" : "+ Note"}

                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>

          </div>
        );
      })()}

      {/* ════ STATISTIQUES ════ */}
      {page==="stats" && (()=>{

        /* ── Calculs ── */
        const healthScore = total === 0 ? 100 : Math.round((healthy / total) * 100);
        const scoreColor  = healthScore >= 70 ? "#1db954" : healthScore >= 40 ? "#f59e0b" : "#ef4444";
        const circumference = 2 * Math.PI * 52;
        const dashOffset    = circumference - (healthScore / 100) * circumference;

        const avgConf2    = total ? Math.round(history.reduce((a,b)=>a+b.score,0)/total) : 0;
        const lastAnalysis= history[0];

        /* Classement maladies */
        const diseaseRank = Object.entries(
          history.reduce((acc,h)=>{ acc[h.maladie]=(acc[h.maladie]||0)+1; return acc; },{})
        ).sort((a,b)=>b[1]-a[1]);
        const maxD = diseaseRank[0]?.[1] || 1;

        /* Niveau par type */
        const niveauMap = history.reduce((acc,h)=>{ acc[h.niveau]=(acc[h.niveau]||0)+1; return acc; },{});

        /* Conseil global */
        const globalTip = healthScore >= 80
          ? "🌿 Excellente santé globale ! Continuez la surveillance régulière."
          : healthScore >= 50
          ? "⚠️ Quelques infections détectées. Appliquez les traitements recommandés et re-analysez dans 48h."
          : "🚨 Situation critique. Consultez un agronome et isolez les plantes infectées immédiatement.";

        return (<>
          <div className="section-title">Vue d'ensemble analytique</div>

          {/* KPI row */}

            <div className="stats-kpi">

              <div className="stats-kpi-icon">🔬</div>
              <div className="stats-kpi-val"><AnimatedNumber value={total}/></div>
              <div className="stats-kpi-label">Total analyses</div>
              <div className="stats-kpi-sub" style={{color:"var(--text3)"}}>Session courante</div>
            </div>
            <div className="stats-kpi">
              <div className="stats-kpi-accent" style={{background:"linear-gradient(90deg,#1db954,#059669)"}}/>
              <div className="stats-kpi-icon">✅</div>
              <div className="stats-kpi-val" style={{color:"#1db954"}}><AnimatedNumber value={healthy} color="#1db954"/></div>
              <div className="stats-kpi-label">Plantes saines</div>
              <div className="stats-kpi-sub" style={{color:"#1db954"}}>
                {total ? Math.round(healthy/total*100) : 0}% du total
              </div>
            </div>
            <div className="stats-kpi">
              <div className="stats-kpi-accent" style={{background:"linear-gradient(90deg,#f59e0b,#d97706)"}}/>
              <div className="stats-kpi-icon">⚠️</div>
              <div className="stats-kpi-val" style={{color:"#f59e0b"}}><AnimatedNumber value={sick} color="#f59e0b"/></div>
              <div className="stats-kpi-label">Infectées</div>
              <div className="stats-kpi-sub" style={{color:"#f59e0b"}}>
                {total ? Math.round(sick/total*100) : 0}% du total
              </div>
            </div>
            <div className="stats-kpi">
              <div className="stats-kpi-accent" style={{background:"linear-gradient(90deg,#ef4444,#b91c1c)"}}/>
              <div className="stats-kpi-icon">🚨</div>
              <div className="stats-kpi-val" style={{color:"#ef4444"}}><AnimatedNumber value={critical} color="#ef4444"/></div>
              <div className="stats-kpi-label">Critiques</div>
              <div className="stats-kpi-sub" style={{color:"#ef4444"}}>
                {total ? Math.round(critical/total*100) : 0}% du total
              </div>
            </div>
          </div>

          {/* Ligne 1 : Score santé + Donut + Graphique ligne */}
          <div className="stats-grid-top">

            {/* Graphique ligne historique */}
            <div className="chart-card">
              <div className="cc-head">
                <div className="cc-title">📈 Évolution des analyses (session)</div>
                <span className="cc-period">Temps réel</span>
              </div>
              <div className="cc-sub" style={{marginBottom:"10px"}}>Confiance moyenne des {total} dernières analyses</div>
              {total === 0
                ? <div className="empty-box" style={{minHeight:"180px"}}><div className="e-icon">📭</div><p>Lancez des analyses<br/>pour voir l'évolution</p></div>
                : <div style={{height:"200px"}}><MultiLine
                    labels={history.slice().reverse().map((_,i)=>`#${i+1}`)}
                    datasets={[
                      {label:"Confiance (%)", data:history.slice().reverse().map(h=>h.score), color:"#1db954"},
                      {label:"Seuil critique (80%)", data:history.map(()=>80), color:"#ef4444"},
                    ]}
                    height={200}
                  /></div>
              }
            </div>

            {/* Score de santé global */}
            <div className="chart-card" style={{display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center"}}>
              <div className="cc-title" style={{marginBottom:"4px",textAlign:"center"}}>🌿 Score de santé global</div>
              <div className="cc-sub" style={{textAlign:"center",marginBottom:"12px"}}>Indice phytosanitaire de la session</div>
              <div className="health-score-ring">
                <svg width="120" height="120" viewBox="0 0 120 120">
                  <circle className="ring-bg" cx="60" cy="60" r="52"/>
                  <circle className="ring-fill"
                    cx="60" cy="60" r="52"
                    stroke={scoreColor}
                    strokeDasharray={circumference}
                    strokeDashoffset={dashOffset}
                  />
                </svg>
                <div style={{position:"absolute",inset:0,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center"}}>
                  <span style={{fontSize:"1.8rem",fontWeight:900,color:scoreColor,lineHeight:1}}><AnimatedNumber value={healthScore} suffix="%" color={scoreColor}/></span>
                  <span style={{fontSize:"0.62rem",color:"var(--text3)",fontWeight:600,marginTop:2}}>SANTÉ</span>
                </div>
              </div>
              <div style={{fontSize:"0.82rem",fontWeight:700,color:scoreColor,marginTop:"4px"}}>
                {healthScore>=80?"Excellent":healthScore>=60?"Bon":healthScore>=40?"Moyen":"Critique"}
              </div>
              <div className="stats-tip" style={{marginTop:"12px",fontSize:"0.72rem"}}>
                <span>💡</span><span>{globalTip}</span>
              </div>
            </div>
          </div>

          {/* Ligne 2 : Classement maladies + Répartition + Capteurs */}
          <div className="stats-grid-bot">

            {/* Classement maladies */}
            <div className="chart-card">
              <div className="cc-title" style={{marginBottom:"2px"}}>🦠 Maladies les plus détectées</div>
              <div className="cc-sub" style={{marginBottom:"14px"}}>Classement par fréquence</div>
              {diseaseRank.length === 0
                ? <div className="empty-box"><div className="e-icon">🔬</div><p>Aucune donnée</p></div>
                : diseaseRank.map(([name, count], i) => (
                  <div className="disease-rank-item" key={name}>
                    <div className={`rank-num ${i===0?"top":""}`}>{i+1}</div>
                    <div className="rank-name">{name}</div>
                    <div className="rank-bar-bg">
                      <div className="rank-bar-fill" style={{
                        width:`${Math.round(count/maxD*100)}%`,
                        background: i===0?"#ef4444":i===1?"#f59e0b":"#3b82f6"
                      }}/>
                    </div>
                    <div className="rank-count" style={{
                      color: i===0?"#ef4444":i===1?"#f59e0b":"#3b82f6"
                    }}>{count}</div>
                  </div>
                ))
              }
            </div>

            {/* Donut répartition */}
            <div className="chart-card">
              <div className="cc-title" style={{marginBottom:"2px"}}>🥧 Répartition des statuts</div>
              <div className="cc-sub" style={{marginBottom:"8px"}}>Saine / Infectée / Critique</div>
              {total === 0
                ? <div className="empty-box"><div className="e-icon">🔬</div><p>Aucune donnée</p></div>
                : <div style={{height:"190px"}}><Donut
                    data={[healthy, sick, critical].filter((_,i)=>[healthy,sick,critical][i]>0)}
                    labels={["Saines","Infectées","Critiques"].filter((_,i)=>[healthy,sick,critical][i]>0)}
                    colors={["#1db954","#f59e0b","#ef4444"].filter((_,i)=>[healthy,sick,critical][i]>0)}
                  /></div>
              }
            </div>

            {/* Stats capteurs */}
            <div className="chart-card">
              <div className="cc-title" style={{marginBottom:"2px"}}>📡 État actuel des capteurs</div>
              <div className="cc-sub" style={{marginBottom:"14px"}}>Valeurs capteurs en temps réel</div>
              {[
                {label:"Température",  val:`${sensors.temp}°C`,  pct:Math.round((sensors.temp-10)/30*100), color:"#f59e0b", icon:"🌡️",
                  status: sensors.temp<18?"Froid":sensors.temp>32?"Chaud":"Optimal"},
                {label:"Humidité air", val:`${sensors.humidity}%`, pct:sensors.humidity, color:"#3b82f6", icon:"💧",
                  status: sensors.humidity<40?"Sec":sensors.humidity>80?"Saturé":"Optimal"},
                {label:"Humidité sol", val:`${sensors.soil}%`, pct:sensors.soil, color:"#1db954", icon:"🌱",
                  status: sensors.soil<40?"Sec":sensors.soil>75?"Saturé":"Optimal"},
              ].map(s=>(
                <div className="sensor-row" key={s.label}>
                  <div className="sensor-head">
                    <span className="sensor-name">{s.icon} {s.label}</span>
                    <span className="sensor-val" style={{color:s.color}}>{s.val}</span>
                  </div>
                  <div className="sensor-bar">
                    <div className="sensor-fill" style={{width:`${Math.min(100,s.pct)}%`, background:s.color}}/>
                  </div>
                  <div style={{fontSize:"0.65rem",color:s.status==="Optimal"?"#1db954":"#f59e0b",fontWeight:700,marginTop:"3px"}}>
                    {s.status==="Optimal"?"✓ Optimal":"⚠ "+s.status}
                  </div>
                </div>
              ))}
              <div style={{marginTop:"12px",fontSize:"0.72rem",color:"var(--text3)",borderTop:"1px solid var(--border)",paddingTop:"10px"}}>
                Confiance moy. IA : <strong style={{color:"var(--green)"}}>{avgConf2}%</strong>
                {lastAnalysis && <span> · Dernier : <strong style={{color:"var(--text)"}}>{lastAnalysis.maladie}</strong></span>}
              </div>
            </div>
          </div>
        </>);
      })()}

      {/* ════ PAGE MALADIES ════ */}
      {page==="maladies" && (()=>{
        // Chiffres calculés depuis le catalogue réel du backend (/recommandations),
        // donc alignés automatiquement sur ce que le modèle CNN chargé sait reconnaître —
        // jamais codés en dur. totalClasses = maladies + 1 classe "saine" par culture (approximation).
        const totalMal = catalogue.length;
        const totalCultures = new Set(catalogue.map(r=>r.plante).filter(Boolean)).size;
        const totalClasses  = totalMal + totalCultures;
        const open   = malOpen;
        const toggle = k => setMalOpen(p=>({...p,[k]:!p[k]}));
        return (<>
          <div className="mal-intro">
            <h2>🦠 Maladies détectables par PlantAI</h2>
            <p>{totalClasses} classes · {totalCultures} cultures agricoles — détection par CNN Keras (MobileNetV2)</p>
          </div>
          <div className="mal-stats-row">
            <div className="mal-stat"><div className="ms-val">{totalCultures}</div><div className="ms-lbl">Cultures</div></div>
            <div className="mal-stat"><div className="ms-val">{totalMal}</div><div className="ms-lbl">Maladies identifiées</div></div>
            <div className="mal-stat"><div className="ms-val">{totalClasses}</div><div className="ms-lbl">Classes totales</div></div>
          </div>
          <div className="mal-legend">
            <span className="mal-legend-item"><span className="mal-niveau-dot healthy"/><b>Saine</b></span>
            <span className="mal-legend-item"><span className="mal-niveau-dot sick"/><b>Malade (traitement possible)</b></span>
            <span className="mal-legend-item"><span className="mal-niveau-dot critical"/><b>Critique (action urgente)</b></span>
          </div>
          {DISEASE_DB.map((cat,ci)=>(
            <div className="mal-culture" key={ci}>
              <div className="mal-culture-head" onClick={()=>toggle(ci)}>
                <span className="mal-culture-icon">{cat.culture.match(/\p{Emoji}/u)?.[0]||"🌿"}</span>
                <span className="mal-culture-name">{cat.culture.replace(/\p{Emoji}/gu,"").trim()}</span>
                <span className="mal-culture-count">{cat.maladies.length} classe{cat.maladies.length>1?"s":""}</span>
                <span className={`mal-culture-chevron ${open[ci]?"open":""}`}>▶</span>
              </div>
              {open[ci] && (
                <div className="mal-disease-list">
                  {cat.maladies.map((m,mi)=>(
                    <div className="mal-disease-row" key={mi}>
                      <span className={`mal-niveau-dot ${m.niveau}`}/>
                      <div className="mal-disease-info">
                        <div className="mal-disease-name">{m.nom}</div>
                        <div className="mal-disease-desc">{m.desc}</div>
                        <div className={`mal-treatment ${m.niveau}`}>💊 {m.traitement}</div>
                      </div>
                    </div>
                  ))}
                </div>
              )}
            </div>
          ))}
          <div style={{background:"linear-gradient(135deg,#3b82f6,#1d4ed8)",borderRadius:14,padding:"20px 24px",marginTop:8,color:"#fff"}}>
            <div style={{fontWeight:800,fontSize:"1rem",marginBottom:6}}>🧠 Modèle CNN Keras (MobileNetV2)</div>
            <div style={{fontSize:"0.84rem",opacity:.9,lineHeight:1.6}}>
              Le diagnostic couvre les <strong>{totalClasses} classes</strong> ({totalCultures} cultures) sur lesquelles le
              modèle a été entraîné. Pour une espèce hors de ce périmètre, PlantAI retourne un résultat de
              confiance insuffisante plutôt qu'un diagnostic erroné.
            </div>
          </div>
        </>);
      })()}

      {page==="users" && userRole==="administrateur" && (
        <UsersAdminPage apiUrl={API_URL} authHeaders={authHeaders} currentUserId={userIdCourant}/>
      )}

    </div>

    {/* ════ FOOTER ════ */}
    <footer className="app-footer">
      <div className="footer-inner">
        <div className="footer-grid">

          {/* Colonne 1 — Marque */}
          <div>
            <div className="footer-brand-logo">
              🌿 <span>PlantAI</span>
            </div>
            <p className="footer-brand-desc">
              Détection intelligente des maladies des plantes par vision artificielle.
              Analysez vos cultures en temps réel grâce à l'IA et à l'ESP32-CAM.
            </p>
            <div className="footer-tech-badges">
              <span className="footer-badge">FastAPI</span>
              <span className="footer-badge">React</span>
              <span className="footer-badge">CNN Keras</span>
              <span className="footer-badge">TensorFlow</span>
              <span className="footer-badge">MongoDB</span>
              <span className="footer-badge">ESP32-CAM</span>
            </div>
          </div>

          {/* Colonne 2 — Navigation */}
          <div>
            <div className="footer-col-title">📋 Navigation</div>
            <ul className="footer-links">
              <li onClick={()=>setPage("dashboard")}>Tableau de bord</li>
              <li onClick={()=>setPage("analyse")}>Analyser une plante</li>
              <li onClick={()=>setPage("history")}>Historique</li>
              <li onClick={()=>setPage("stats")}>Statistiques</li>
              <li onClick={()=>setPage("maladies")}>Maladies détectées</li>
            </ul>
          </div>

          {/* Colonne 3 — Maladies détectées */}
          <div>
            <div className="footer-col-title">🦠 Cultures supportées</div>
            <ul className="footer-links">
              <li>Tomate</li>
              <li>Liste en cours de définition</li>
            </ul>
          </div>

          {/* Colonne 4 — Statut système */}
          <div>
            <div className="footer-col-title">⚙️ Système</div>
            <ul className="footer-links">
              <li>
                <span className="footer-status-dot"/>
                Backend API actif
              </li>
              <li>
                {esp32Connected
                  ? <><span className="footer-status-dot"/>ESP32-CAM connectée</>
                  : <>○ ESP32-CAM hors ligne</>
                }
              </li>
              <li>{catalogue.length ? `${catalogue.length + new Set(catalogue.map(r=>r.plante).filter(Boolean)).size} classes` : "Catalogue…"}</li>
              <li>Confiance moy. {avgConf}%</li>
              <li>{total} analyse{total>1?"s":""} enregistrée{total>1?"s":""}</li>
            </ul>
          </div>

        </div>

        <hr className="footer-divider"/>

        <div className="footer-bottom">
          <div className="footer-copy">
            © {new Date().getFullYear()} <strong>PlantAI</strong> — Tous droits réservés · Projet IA Agriculture
          </div>
          <div className="footer-made">
            Fait avec <span>♥</span> pour l'agriculture intelligente
          </div>
        </div>
      </div>
    </footer>

  </div>);
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => navigator.serviceWorker.register("/sw.js"));
  }
</script>
</body>
</html>
