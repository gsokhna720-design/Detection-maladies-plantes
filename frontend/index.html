    .farmer-healthy .fa-m-happy    { display: block; }
    .farmer-healthy .fa-confetti   { display: block; }
    .farmer-healthy .fa-cheek      { opacity: .75 !important; }
    .farmer-healthy .fa-avatar-inner{ animation: fa-jump .65s ease-in-out infinite; }
    .farmer-healthy .fa-arm-l      { animation: fa-clap-l .28s ease-in-out infinite alternate; }
    .farmer-healthy .fa-arm-r      { animation: fa-clap-r .28s ease-in-out infinite alternate; }
    .farmer-healthy .fa-c1 { animation: fa-cf1 1s ease-out 0.00s infinite; }
    .farmer-healthy .fa-c2 { animation: fa-cf2 1s ease-out 0.20s infinite; }
    .farmer-healthy .fa-c3 { animation: fa-cf3 1s ease-out 0.40s infinite; }
    .farmer-healthy .fa-c4 { animation: fa-cf4 1s ease-out 0.10s infinite; }
    .farmer-healthy .fa-c5 { animation: fa-cf5 1s ease-out 0.30s infinite; }
    .farmer-healthy .fa-c6 { animation: fa-cf6 1s ease-out 0.50s infinite; }
    .farmer-healthy .fa-c7 { animation: fa-cf7 1s ease-out 0.15s infinite; }
    .farmer-healthy .fa-c8 { animation: fa-cf8 1s ease-out 0.35s infinite; }

    /* ═══ SICK ═══ */
    .farmer-sick .fa-brow-w  { display: block; }
    .farmer-sick .fa-m-sad   { display: block; }
    .farmer-sick .fa-tears   { display: block; }
    .farmer-sick .fa-arm-l   { transform: rotate(-22deg); }
    .farmer-sick .fa-arm-r   { transform: rotate(22deg); }
    .farmer-sick .fa-head-g  { animation: fa-cry-sway 2s ease-in-out infinite; }
    .farmer-sick .fa-t1 { animation: fa-tear .9s ease-in 0.00s infinite; }
    .farmer-sick .fa-t2 { animation: fa-tear .9s ease-in 0.35s infinite; }
    .farmer-sick .fa-t3 { animation: fa-tear .9s ease-in 0.15s infinite; }
    .farmer-sick .fa-t4 { animation: fa-tear .9s ease-in 0.50s infinite; }

    /* ═══ CRITICAL ═══ */
    .farmer-critical .fa-brow-w  { display: block; }
    .farmer-critical .fa-m-sad   { display: block; }
    .farmer-critical .fa-tears   { display: block; }
    .farmer-critical .fa-arm-l   { transform: rotate(-28deg); }
    .farmer-critical .fa-arm-r   { transform: rotate(28deg); }
    .farmer-critical .fa-head-g  { animation: fa-cry-sway 1.2s ease-in-out infinite; }
    .farmer-critical .fa-avatar-inner { animation: fa-slump .5s ease-in-out infinite alternate; }
    .farmer-critical .fa-t1 { animation: fa-tear .65s ease-in 0.00s infinite; }
    .farmer-critical .fa-t2 { animation: fa-tear .65s ease-in 0.20s infinite; }
    .farmer-critical .fa-t3 { animation: fa-tear .65s ease-in 0.10s infinite; }
    .farmer-critical .fa-t4 { animation: fa-tear .65s ease-in 0.30s infinite; }

    /* ═══ UNKNOWN ═══ */
    .farmer-unknown .fa-brow-n   { display: block; }
    .farmer-unknown .fa-m-hmm    { display: block; }
    .farmer-unknown .fa-q-mark   { display: block; }
    .farmer-unknown .fa-head-g   { animation: fa-head-tilt 2s ease-in-out infinite; }
    .farmer-unknown .fa-arm-r    { animation: fa-scratch .45s ease-in-out infinite alternate; }

    /* ══════════ KEYFRAMES ══════════ */
    @keyframes fa-breathe  { 0%,100%{transform:scaleY(1)}      50%{transform:scaleY(1.04)} }
    @keyframes fa-sway     { 0%,100%{transform:rotate(-4deg)}  50%{transform:rotate(4deg)} }

   description, traitement, conseil}, idAnalyse } */
function transformBackendResponse(raw) {
  const info  = raw.diseaseInfo || {};
  const conf  = raw.confiance || 0;
  const score = Math.round(conf * 100);
  return {
    maladie:     info.maladie || raw.maladie || "Espèce non reconnue par le modèle",
    niveau:      info.niveau || "unknown",
    score,
    conseil:     info.conseil || "⚠️ Le modèle n'a pas reconnu cette plante avec certitude. Essayez avec une photo nette d'une feuille d'une des cultures supportées (voir la liste ci-dessous).",

}

        temp:    +(Math.min(40,Math.max(10, p.temp    +(Math.random()-.5)*.5))).toFixed(1),
        humidity: Math.min(95,Math.max(20, Math.round(p.humidity+(Math.random()-.5)*2))),

      }));
    },2500);
    return ()=>clearInterval(id);
  },[]);

    setHist(p=>{

}

/* ── TiltCard — effet 3D au survol ── */
function TiltCard({ children, className, style, maxTilt }) {
  maxTilt = maxTilt || 15;
  var ref = React.useRef();
  function onMouseMove(e) {
    var el = ref.current;
    if (!el) return;
    var rect = el.getBoundingClientRect();
    var cx = rect.left + rect.width / 2;
    var cy = rect.top + rect.height / 2;
    var dx = (e.clientX - cx) / (rect.width / 2);
    var dy = (e.clientY - cy) / (rect.height / 2);
    var rotX = (-dy * maxTilt).toFixed(2);
    var rotY = (dx * maxTilt).toFixed(2);
    var mx = ((e.clientX - rect.left) / rect.width * 100).toFixed(1);
    var my = ((e.clientY - rect.top) / rect.height * 100).toFixed(1);
    el.style.transform = "perspective(800px) rotateX("+rotX+"deg) rotateY("+rotY+"deg) scale3d(1.04,1.04,1.04)";
    el.style.boxShadow = "0 24px 60px rgba(0,0,0,0.25)";
    var glare = el.querySelector('.tilt-glare');
    if (glare) {
      glare.style.setProperty('--mx', mx + '%');
      glare.style.setProperty('--my', my + '%');
    }
  }
  function onMouseLeave() {
    var el = ref.current;
    if (!el) return;
    el.style.transform = '';
    el.style.boxShadow = '';
  }
  return React.createElement(
    'div',
    { ref: ref, className: 'tilt-wrap ' + (className || ''), style: style,
      onMouseMove: onMouseMove, onMouseLeave: onMouseLeave },
    React.createElement('div', { className: 'tilt-glare' }),
    children
  );
}

/* ── Sparkline ── */
function Sparkline({ data, color, fill }) {
  const r=useRef(); const c=useRef();
  useEffect(()=>{
    c.current?.destroy();
    if (!data.length) return;
    const ctx = r.current.getContext("2d");
    const grad = ctx.createLinearGradient(0,0,0,70);
    grad.addColorStop(0, color+"44");
    grad.addColorStop(1, color+"00");
    c.current = new Chart(ctx,{
      type:"line",
      data:{labels:data.map((_,i)=>""),datasets:[{data,borderColor:color,backgroundColor:fill?grad:"transparent",borderWidth:2,pointRadius:0,tension:0.5,fill:fill}]},
      options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{enabled:false}},scales:{x:{display:false},y:{display:false}},animation:{duration:400}}
    });
    return ()=>c.current?.destroy();
  },[JSON.stringify(data)]);
  return <canvas ref={r}/>;
}

/* ── Multi-line chart ── */
function MultiLine({ labels, datasets, height=190 }) {
  const r=useRef(); const c=useRef();
  useEffect(()=>{
    c.current?.destroy();
    if (!labels.length) return;
    c.current = new Chart(r.current.getContext("2d"),{
      type:"line",
      data:{labels,datasets:datasets.map(d=>{
        const ctx = r.current.getContext("2d");
        const g = ctx.createLinearGradient(0,0,0,height);
        g.addColorStop(0,d.color+"30"); g.addColorStop(1,d.color+"00");
        return {label:d.label,data:d.data,borderColor:d.color,backgroundColor:g,borderWidth:2.5,pointRadius:3,pointBackgroundColor:d.color,tension:0.4,fill:true};
      })},
      options:{responsive:true,maintainAspectRatio:false,
        plugins:{legend:{labels:{color:"#64748b",font:{size:11,family:"Inter"},boxWidth:10,padding:14}},
          tooltip:{backgroundColor:"#fff",titleColor:"#0f172a",bodyColor:"#64748b",borderColor:"#e2e8f0",borderWidth:1,padding:10,boxPadding:4}},
        scales:{
          x:{grid:{color:"#f1f5f9",drawBorder:false},ticks:{color:"#94a3b8",font:{size:10}}},
          y:{grid:{color:"#f1f5f9",drawBorder:false},ticks:{color:"#94a3b8",font:{size:10}}}
        }
      }
    });
    return ()=>c.current?.destroy();
  },[JSON.stringify(labels),JSON.stringify(datasets)]);
  return <canvas ref={r}/>;
}

/* ── Donut ── */
function Donut({ data, labels, colors }) {
  const r=useRef(); const c=useRef();
  useEffect(()=>{
    c.current?.destroy();
    if (!data.length) return;
    c.current = new Chart(r.current.getContext("2d"),{
      type:"doughnut",
      data:{labels,datasets:[{data,backgroundColor:colors,borderWidth:3,borderColor:"#fff",hoverOffset:6}]},
      options:{responsive:true,maintainAspectRatio:false,cutout:"68%",
        plugins:{legend:{position:"bottom",labels:{padding:14,font:{size:11,family:"Inter"},color:"#475569",boxWidth:11}},
          tooltip:{backgroundColor:"#fff",titleColor:"#0f172a",bodyColor:"#64748b",borderColor:"#e2e8f0",borderWidth:1}}
      }
    });
    return ()=>c.current?.destroy();
  },[JSON.stringify(data)]);
  return <canvas ref={r}/>;
}


/* ══════════════ CURSOR TRAIL ══════════════ */
function CursorTrail() {
  useEffect(() => {
    var canvas = document.createElement('canvas');
    canvas.id = 'cursor-canvas';
    canvas.style.cssText = 'position:fixed;inset:0;z-index:999999;pointer-events:none';
    document.body.appendChild(canvas);
    var ctx = canvas.getContext('2d');
    var W, H;
    var resize = function() { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; };
    resize(); window.addEventListener('resize', resize);
    var particles = [], mx = -300, my = -300, frame = 0;
    window.addEventListener('mousemove', function(e){ mx=e.clientX; my=e.clientY; });
    var animId;
    function loop() {
      animId = requestAnimationFrame(loop);
      ctx.clearRect(0,0,W,H);
      frame++;
      if (frame%2===0 && mx>0) {
        particles.push({
          x:mx+(Math.random()-.5)*6, y:my+(Math.random()-.5)*6,
          vx:(Math.random()-.5)*2, vy:(Math.random()-.5)*2-1,
          life:1, size:Math.random()*3+1.5, hue:110+Math.random()*50
        });
      }
      for (var i=particles.length-1; i>=0; i--) {
        var p=particles[i];
        p.x+=p.vx; p.y+=p.vy; p.vy+=0.06; p.vx*=0.96; p.life-=0.05;
        if(p.life<=0){particles.splice(i,1);continue;}
        ctx.save();
        ctx.globalAlpha=p.life*0.7;
        ctx.beginPath(); ctx.arc(p.x,p.y,p.size*p.life,0,Math.PI*2);
        ctx.fillStyle='hsl('+p.hue+',85%,55%)';
        ctx.shadowColor='hsl('+p.hue+',85%,55%)'; ctx.shadowBlur=8;
        ctx.fill(); ctx.restore();
      }
    }
    loop();
    return function(){ cancelAnimationFrame(animId); window.removeEventListener('resize',resize); if(canvas.parentNode)canvas.remove(); };
  }, []);
  return null;
}

/* ══════════════ CONFETTI ══════════════ */
function triggerConfetti(ox, oy) {
  var canvas = document.getElementById('confetti-canvas');
  if (!canvas) {
    canvas = document.createElement('canvas');
    canvas.id='confetti-canvas';
    canvas.style.cssText='position:fixed;inset:0;z-index:999998;pointer-events:none';
    document.body.appendChild(canvas);
  }
  canvas.width=window.innerWidth; canvas.height=window.innerHeight;
  var ctx=canvas.getContext('2d');
  var cx=ox||canvas.width/2, cy=oy||canvas.height*0.38;
  var colors=['#1db954','#4ade80','#a7f3d0','#fbbf24','#34d399','#6ee7b7','#f9a8d4','#93c5fd','#c4b5fd'];
  var pieces=[];
  for(var i=0;i<110;i++){
    var ang=(Math.random()*340-170)*Math.PI/180;
    var spd=Math.random()*12+4;
    pieces.push({
      x:cx,y:cy,vx:Math.cos(ang)*spd,vy:Math.sin(ang)*spd-3,
      w:Math.random()*10+4,h:Math.random()*5+2,
      color:colors[Math.floor(Math.random()*colors.length)],
      rot:Math.random()*360,rotSpd:(Math.random()-.5)*9,
      life:1,grav:0.14+Math.random()*0.08,
      shape:Math.random()>.6?'circle':'rect'
    });
  }
  var animId;
  function draw(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    var any=false;
    pieces.forEach(function(p){
      p.x+=p.vx;p.y+=p.vy;p.vy+=p.grav;p.vx*=0.99;
      p.rot+=p.rotSpd;p.life-=0.015;
      if(p.life<=0||p.y>canvas.height)return;
      any=true;
      ctx.save();ctx.globalAlpha=Math.min(1,p.life*1.4);
      ctx.fillStyle=p.color;ctx.shadowColor=p.color;ctx.shadowBlur=4;
      ctx.translate(p.x,p.y);ctx.rotate(p.rot*Math.PI/180);
      if(p.shape==='circle'){ctx.beginPath();ctx.arc(0,0,p.w/2,0,Math.PI*2);ctx.fill();}
      else{ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);}
      ctx.restore();
    });
    if(any)animId=requestAnimationFrame(draw);
    else{cancelAnimationFrame(animId);ctx.clearRect(0,0,canvas.width,canvas.height);}
  }
  draw();
}

/* ══════════════ ANIMATED NUMBER ══════════════ */
function AnimatedNumber({ value, suffix, prefix, decimals, color }) {
  var numVal = Number(value);
  var [disp, setDisp] = useState(numVal);
  var prev = useRef(numVal);
  useEffect(function(){
    var from=Number(prev.current), to=Number(value);
    prev.current=value;
    if(from===to)return;
    var dur=650, start=performance.now(), id;
    function step(now){
      var t=Math.min((now-start)/dur,1);
      var ease=1-Math.pow(1-t,3);
      var v=from+(to-from)*ease;
      setDisp(decimals!=null?v.toFixed(decimals):Math.round(v));
      if(t<1)id=requestAnimationFrame(step);
    }
    id=requestAnimationFrame(step);
    return function(){cancelAnimationFrame(id);};
  },[value]);
  return React.createElement('span',{className:'anim-num',style:color?{color}:{}},
    (prefix||'')+disp+(suffix||'')
  );
}

/* ══════════════ ARC GAUGE ══════════════ */
function ArcGauge({ value, color, size }) {
  size = size||112;
  var stroke=9, r=(size-stroke*2)/2, cx=size/2, cy=size/2;
  function pTC(deg){ var rad=(deg-90)*Math.PI/180; return {x:cx+r*Math.cos(rad),y:cy+r*Math.sin(rad)}; }
  function arc(s,e){ var sp=pTC(s),ep=pTC(e),lg=e-s>180?1:0; return 'M '+sp.x+' '+sp.y+' A '+r+' '+r+' 0 '+lg+' 1 '+ep.x+' '+ep.y; }
  var bgPath=arc(135,405);
  var fgPath=arc(135, 135+Math.min(value/100,1)*270);
  var c=color||'#1db954';
  return (
    <div className="arc-gauge-wrap" style={{width:size,height:size*0.76}}>
      <svg width={size} height={size} viewBox={'0 0 '+size+' '+size} style={{position:"absolute",top:0,left:0}}>
        <path d={bgPath} fill="none" stroke="rgba(148,163,184,0.2)" strokeWidth={stroke} strokeLinecap="round"/>
        <path d={fgPath} fill="none" stroke={c} strokeWidth={stroke} strokeLinecap="round"
          style={{filter:'drop-shadow(0 0 6px '+c+'88)',transition:'all 1.2s cubic-bezier(0.34,1.56,0.64,1)'}}/>
      </svg>
      <div className="arc-gauge-center">
        <div className="arc-gauge-val" style={{color:c}}>{value}<span style={{fontSize:"0.5em",fontWeight:700}}>%</span></div>
        <div className="arc-gauge-lbl">Confidence</div>
      </div>
    </div>
  );
}

/* ══════════════ COMMAND PALETTE ══════════════ */
function CommandPalette({ onClose, onNavigate, history, darkMode, onToggleDark }) {
  var [q,setQ]=useState(""), [sel,setSel]=useState(0);
  var inputRef=useRef();
  useEffect(function(){ inputRef.current&&inputRef.current.focus(); },[]);

  var BASE=[
    {icon:"📊",name:"Dashboard",        desc:"Vue principale",          action:function(){onNavigate("dashboard");onClose();}},
    {icon:"🔍",name:"Analyser",          desc:"Analyser une plante",     action:function(){onNavigate("analyse");onClose();}},
    {icon:"🗂️",name:"Historique",        desc:"Toutes les analyses",     action:function(){onNavigate("history");onClose();}},
    {icon:"📈",name:"Statistiques",      desc:"Graphiques & tendances",  action:function(){onNavigate("stats");onClose();}},
    {icon:darkMode?"☀️":"🌙",name:"Basculer le thème", desc:darkMode?"→ Mode clair":"→ Mode sombre", action:function(){onToggleDark();onClose();}},
    {icon:"📄",name:"Exporter PDF",      desc:"Rapport complet",         action:function(){onClose();}},
  ];
  var HIST=(history||[]).slice(0,4).map(function(h){return {
    icon:h.niveau==="healthy"?"🟢":h.niveau==="critical"?"🔴":"🟡",
    name:h.maladie, desc:h.score+"% · "+(h.image||"image"),
    action:function(){onNavigate("history");onClose();}
  };});

  var filtered=q?[...BASE,...HIST].filter(function(c){
    return c.name.toLowerCase().includes(q.toLowerCase())||c.desc.toLowerCase().includes(q.toLowerCase());
  }):BASE;

  var sections=q?[{lbl:"Résultats",items:filtered}]:[
    ...(HIST.length?[{lbl:"Analyses récentes",items:HIST}]:[]),
    {lbl:"Actions",items:BASE}
  ];
  var allItems=sections.reduce(function(a,s){return a.concat(s.items);},[]);

  var handleKey=function(e){
    if(e.key==='Escape'){onClose();return;}
    if(e.key==='ArrowDown'){e.preventDefault();setSel(function(s){return Math.min(s+1,allItems.length-1);});}
    if(e.key==='ArrowUp'){e.preventDefault();setSel(function(s){return Math.max(s-1,0);});}
    if(e.key==='Enter'){e.preventDefault();if(allItems[sel])allItems[sel].action();}
  };

  var gIdx=0;
  return (
    <div className="cmd-overlay" onClick={onClose}>
      <div className="cmd-box" onClick={function(e){e.stopPropagation();}}>
        <div className="cmd-input-row">
          <span className="cmd-search-icon">⌕</span>
          <input ref={inputRef} className="cmd-input"
            placeholder="Rechercher une page, action, analyse…"
            value={q} onChange={function(e){setQ(e.target.value);setSel(0);}}
            onKeyDown={handleKey}/>
          <span className="cmd-esc">ESC</span>
        </div>
        <div className="cmd-results">
          {sections.map(function(sec,si){
            return (
              <div key={si}>
                <div className="cmd-section-lbl">{sec.lbl}</div>
                {sec.items.map(function(c,i){
                  var idx=gIdx++;
                  return (
                    <div key={i} className={"cmd-item"+(sel===idx?" selected":"")}
                      onMouseEnter={function(){setSel(idx);}}
                      onClick={function(){c.action();}}>
                      <span className="cmd-item-icon">{c.icon}</span>
                      <span className="cmd-item-name">{c.name}</span>
                      <span className="cmd-item-desc">{c.desc}</span>
                    </div>
                  );
                })}
              </div>
            );
          })}
          {allItems.length===0&&<div style={{padding:"22px",textAlign:"center",color:"var(--text3)",fontSize:"0.82rem"}}>Aucun résultat pour "{q}"</div>}
        </div>
        <div className="cmd-footer">
          <span><kbd>↑↓</kbd> naviguer</span>
          <span><kbd>↵</kbd> sélectionner</span>
          <span><kbd>ESC</kbd> fermer</span>
          <span style={{marginLeft:"auto",fontWeight:700,color:"var(--green-dark)"}}>PlantAI v2.0</span>
        </div>
      </div>
    </div>
  );
}

/* ══════════════ LIVE TICKER (hook) ══════════════ */
function useTicker(result, connected) {
  var esp32Status = connected?"ESP32-CAM · Connectée ✓":"ESP32-CAM · Hors ligne";
  var base=[esp32Status,"CNN Keras · Chargé","FastAPI · Prête","MongoDB · Actif"];
  var msgs=result?["Dernier: "+result.maladie.slice(0,22),"Conf: "+result.score+"%"].concat(base):base;
  var [idx,setIdx]=useState(0), [tick,setTick]=useState(0);
  useEffect(function(){
    var id=setInterval(function(){setIdx(function(i){return(i+1)%msgs.length;});setTick(function(t){return t+1;});},3000);

  },[msgs.length]);

/* ══════════════ SCROLL REVEAL (hook) ══════════════ */
function useScrollReveal(page) {
  useEffect(function(){
    var revealEls = document.querySelectorAll('.reveal');
    if(revealEls.length) revealEls.forEach(function(el){el.classList.remove('visible');});

    var obs = null;
    var t = setTimeout(function(){
      var els = document.querySelectorAll('.reveal');
      if(!els.length) return;
      if(!('IntersectionObserver' in window)){
        els.forEach(function(el){el.classList.add('visible');}); return;
      }
      obs = new IntersectionObserver(function(entries){
        entries.forEach(function(e){if(e.isIntersecting) e.target.classList.add('visible');});
      },{threshold:0.01});
      els.forEach(function(el){obs.observe(el);});
    }, 50);

    return function(){ clearTimeout(t); if(obs) obs.disconnect(); };
  },[page]);
}

/* ══════════════ SPLASH SCREEN ══════════════ */
function SplashScreen({ onDone }) {
  const [fading, setFading] = useState(false);
  const [status, setStatus] = useState("Initialisation du système…");
  const canvasRef = useRef();
  const rendererRef = useRef();

  const STEPS = [
    { t: 400,  msg: "Connexion à l'ESP32-CAM…" },
    { t: 900,  msg: "Chargement du modèle CNN…" },
    { t: 1500, msg: "Lecture des capteurs IoT…" },
    { t: 2100, msg: "Prêt ✓" },
  ];

  /* ── Three.js 3D sphere ── */
  useEffect(() => {
    const THREE = window.THREE;
    if (!THREE || !canvasRef.current) return;
    const canvas = canvasRef.current;
    const W = canvas.offsetWidth || window.innerWidth;
    const H = canvas.offsetHeight || window.innerHeight;

    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
    renderer.setSize(W, H);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setClearColor(0x000000, 0);
    rendererRef.current = renderer;

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(60, W / H, 0.1, 100);
    camera.position.z = 3.2;

    /* Fibonacci sphere — distribution uniforme des particules */
    const N = 280;
    const positions = [];
    const pts = [];
    const goldenAngle = Math.PI * (3 - Math.sqrt(5));
    for (let i = 0; i < N; i++) {
      const y = 1 - (i / (N - 1)) * 2;
      const r = Math.sqrt(1 - y * y);
      const theta = goldenAngle * i;
      const x = Math.cos(theta) * r;
      const z = Math.sin(theta) * r;
      positions.push(x, y, z);
      pts.push({ x, y, z });
    }

    /* Points verts lumineux */
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
    const mat = new THREE.PointsMaterial({
      color: 0x1db954, size: 0.045,
      transparent: true, opacity: 0.95,
      sizeAttenuation: true,
    });
    const sphere = new THREE.Points(geo, mat);
    scene.add(sphere);

    /* Lignes entre particules proches — réseau neuronal */
    const linePos = [];
    const threshold = 0.38;
    for (let i = 0; i < pts.length; i++) {
      for (let j = i + 1; j < pts.length; j++) {
        const dx = pts[i].x - pts[j].x;
        const dy = pts[i].y - pts[j].y;
        const dz = pts[i].z - pts[j].z;
        if (Math.sqrt(dx*dx + dy*dy + dz*dz) < threshold) {
          linePos.push(pts[i].x, pts[i].y, pts[i].z, pts[j].x, pts[j].y, pts[j].z);
        }
      }
    }
    const lineGeo = new THREE.BufferGeometry();
    lineGeo.setAttribute('position', new THREE.Float32BufferAttribute(linePos, 3));
    const lineMat = new THREE.LineBasicMaterial({ color: 0x4ade80, transparent: true, opacity: 0.18 });
    const lines = new THREE.LineSegments(lineGeo, lineMat);
    scene.add(lines);

    /* Halo lumineux central */
    const glowGeo = new THREE.SphereGeometry(0.92, 32, 32);
    const glowMat = new THREE.MeshBasicMaterial({
      color: 0x1db954, transparent: true, opacity: 0.04, side: THREE.BackSide,
    });
    scene.add(new THREE.Mesh(glowGeo, glowMat));

    /* Deuxième sphère de points plus petits — profondeur */
    const N2 = 120;
    const pos2 = [];
    for (let i = 0; i < N2; i++) {
      const y = 1 - (i / (N2 - 1)) * 2;
      const r = Math.sqrt(1 - y * y) * 1.45;
      const theta = goldenAngle * i * 1.3;
      pos2.push(Math.cos(theta)*r, y*1.45, Math.sin(theta)*r);
    }
    const geo2 = new THREE.BufferGeometry();
    geo2.setAttribute('position', new THREE.Float32BufferAttribute(pos2, 3));
    const mat2 = new THREE.PointsMaterial({ color: 0xa7f3d0, size: 0.022, transparent: true, opacity: 0.5 });
    scene.add(new THREE.Points(geo2, mat2));

    /* Animation loop */
    let frame; let t = 0;
    const animate = () => {
      frame = requestAnimationFrame(animate);
      t += 0.008;
      sphere.rotation.y = t * 0.55;
      sphere.rotation.x = Math.sin(t * 0.3) * 0.25;
      lines.rotation.y  = t * 0.55;
      lines.rotation.x  = Math.sin(t * 0.3) * 0.25;
      /* Pulsation de taille */
      mat.size = 0.045 + Math.sin(t * 1.8) * 0.008;
      mat.opacity = 0.85 + Math.sin(t * 2.1) * 0.12;
      renderer.render(scene, camera);
    };
    animate();

    return () => {
      cancelAnimationFrame(frame);
      renderer.dispose();
      geo.dispose(); mat.dispose();
      lineGeo.dispose(); lineMat.dispose();
    };
  }, []);

  /* ── Timers splash ── */
  useEffect(() => {
    const timers = STEPS.map(s => setTimeout(() => setStatus(s.msg), s.t));
    const fadeTimer = setTimeout(() => setFading(true), 3200);
    const doneTimer = setTimeout(() => onDone(), 3900);
    return () => { timers.forEach(clearTimeout); clearTimeout(fadeTimer); clearTimeout(doneTimer); };
  }, []);

  return (
    <div className={`splash ${fading ? "fade-out" : ""}`}>
      {/* Canvas Three.js en arrière-plan */}
      <canvas ref={canvasRef} style={{
        position:"absolute", inset:0, width:"100%", height:"100%", zIndex:0, pointerEvents:"none"
      }}/>

      {/* Cercles décoratifs flous */}
      <div className="splash-circle c1"/>
      <div className="splash-circle c2"/>
      <div className="splash-circle c3"/>

      {/* Logo + titre */}
      <div className="splash-logo" style={{position:"relative",zIndex:2}}>
        <div className="splash-icon-wrap">🌿</div>
        <div className="splash-title">PlantAI</div>
        <div className="splash-subtitle">Détection intelligente des maladies des plantes</div>
      </div>

      {/* Barre de progression */}
      <div className="splash-bar-wrap" style={{position:"relative",zIndex:2}}>
        <div className="splash-bar-track">
          <div className="splash-bar-fill"/>
        </div>
        <div className="splash-status">{status}</div>
      </div>

      {/* Tags technos */}
      <div className="splash-tags" style={{position:"relative",zIndex:2}}>
        <span className="splash-tag">📡 ESP32-CAM</span>
        <span className="splash-tag">🤖 CNN</span>
        <span className="splash-tag">⚡ FastAPI</span>
        <span className="splash-tag">🍃 MongoDB</span>
        <span className="splash-tag">⚛️ React</span>
        <span className="splash-tag">🔵 Three.js</span>
      </div>
    </div>
  );
}

function LoginPage({ onLogin /* onLogin(email) */ }) {
  const [email,       setEmail]       = useState("");

  const [showPw,      setShowPw]      = useState(false);
  const [remember,    setRemember]    = useState(false);
  const [loading,     setLoading]     = useState(false);
  const [error,       setError]       = useState("");
  const particlesCanvasRef = useRef();

  useEffect(() => {
    var THREE = window.THREE;
    if (!THREE || !particlesCanvasRef.current) return;
    var canvas = particlesCanvasRef.current;
    var W = canvas.offsetWidth || 480;
    var H = canvas.offsetHeight || 600;
    canvas.width = W; canvas.height = H;

    var renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: true });
    renderer.setSize(W, H);
    renderer.setClearColor(0x000000, 0);

    var scene = new THREE.Scene();
    var camera = new THREE.PerspectiveCamera(55, W / H, 0.1, 200);
    camera.position.z = 28;

    /* ── Particules flottantes ── */
    var N = 160;
    var positions = new Float32Array(N * 3);
    var velocities = [];
    var sizes = new Float32Array(N);
    var opacities = new Float32Array(N);

    for (var i = 0; i < N; i++) {
      positions[i*3]   = (Math.random() - 0.5) * 40;
      positions[i*3+1] = (Math.random() - 0.5) * 50;
      positions[i*3+2] = (Math.random() - 0.5) * 20;
      velocities.push({
        x: (Math.random() - 0.5) * 0.012,
        y: Math.random() * 0.018 + 0.005,
        z: (Math.random() - 0.5) * 0.006,
        phase: Math.random() * Math.PI * 2,
        speed: Math.random() * 0.4 + 0.3
      });
      sizes[i]    = Math.random() * 0.10 + 0.035;
      opacities[i] = Math.random() * 0.5 + 0.25;
    }

    var geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));

    var mat = new THREE.PointsMaterial({
      color: 0xffffff, size: 0.12,
      transparent: true, opacity: 0.55,
      sizeAttenuation: true, depthWrite: false
    });

    var points = new THREE.Points(geo, mat);
    scene.add(points);

    /* ── Quelques lignes reliant les particules proches ── */
    var lineGeo = new THREE.BufferGeometry();
    var linePts = [];
    for (var a = 0; a < N; a++) {
      for (var b = a+1; b < N; b++) {
        var dx = positions[a*3] - positions[b*3];
        var dy = positions[a*3+1] - positions[b*3+1];
        var dz = positions[a*3+2] - positions[b*3+2];
        var dist = Math.sqrt(dx*dx + dy*dy + dz*dz);
        if (dist < 8) {
          linePts.push(positions[a*3], positions[a*3+1], positions[a*3+2]);
          linePts.push(positions[b*3], positions[b*3+1], positions[b*3+2]);
        }
      }
    }
    if (linePts.length > 0) {
      lineGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(linePts), 3));
      var lineMat = new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.1 });
      scene.add(new THREE.LineSegments(lineGeo, lineMat));
    }

    var animId;
    var t = 0;
    var posArr = geo.attributes.position.array;

    function animate() {
      animId = requestAnimationFrame(animate);
      t += 0.016;
      for (var k = 0; k < N; k++) {
        var v = velocities[k];
        posArr[k*3]   += v.x + Math.sin(t * v.speed + v.phase) * 0.003;
        posArr[k*3+1] += v.y;
        posArr[k*3+2] += v.z + Math.cos(t * v.speed * 0.7 + v.phase) * 0.003;
        /* reboucle en haut → réapparaît en bas */
        if (posArr[k*3+1] > 26) posArr[k*3+1] = -26;
        if (posArr[k*3]   >  22) posArr[k*3]   = -22;

      }
      geo.attributes.position.needsUpdate = true;
      /* légère pulsation de l'opacité globale */
      mat.opacity = 0.5 + Math.sin(t * 0.8) * 0.1;
      renderer.render(scene, camera);
    }
    animate();

    return function () {

  }, []);

/* ══════════════ FEUILLE 3D ══════════════ */
function Leaf3D({ niveau }) {
  var canvasRef = useRef();
  useEffect(function() {
    var THREE = window.THREE;
    if (!THREE || !canvasRef.current) return;
    var canvas = canvasRef.current;
    var W = canvas.offsetWidth || 200;
    var H = canvas.offsetHeight || 200;
    var renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: true });
    renderer.setSize(W, H);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setClearColor(0x000000, 0);
    var scene = new THREE.Scene();
    var camera = new THREE.PerspectiveCamera(45, W / H, 0.1, 100);
    camera.position.set(0, 0, 4.5);

    var col = niveau === 'healthy' ? 0x1db954
            : niveau === 'sick'    ? 0xf59e0b
            : niveau === 'critical'? 0xef4444
            : 0x22c55e;

    /* Forme feuille */
    var shape = new THREE.Shape();
    shape.moveTo(0, -1.3);
    shape.bezierCurveTo(-0.15, -0.9, -1.0, -0.5, -1.05, 0.05);
    shape.bezierCurveTo(-1.05, 0.75, -0.5, 1.15, 0, 1.3);
    shape.bezierCurveTo(0.5, 1.15, 1.05, 0.75, 1.05, 0.05);
    shape.bezierCurveTo(1.0, -0.5, 0.15, -0.9, 0, -1.3);

    var extrudeSettings = { depth: 0.1, bevelEnabled: true, bevelThickness: 0.03, bevelSize: 0.03, bevelSegments: 4 };
    var geo = new THREE.ExtrudeGeometry(shape, extrudeSettings);
    geo.center();
    var mat = new THREE.MeshStandardMaterial({ color: col, roughness: 0.35, metalness: 0.08, side: THREE.DoubleSide });
    var leaf = new THREE.Mesh(geo, mat);
    scene.add(leaf);

    /* Nervure centrale */
    var veinMat = new THREE.MeshStandardMaterial({ color: 0xffffff, transparent: true, opacity: 0.18 });
    var vein = new THREE.Mesh(new THREE.CylinderGeometry(0.014, 0.008, 2.4, 5), veinMat);
    leaf.add(vein);

    /* Nervures latérales */
    for (var s = -1; s <= 1; s += 2) {
      for (var j = 0; j < 3; j++) {
        var lvGeo = new THREE.CylinderGeometry(0.007, 0.004, 0.55, 4);
        var lv = new THREE.Mesh(lvGeo, veinMat);
        lv.rotation.z = s * (Math.PI / 4 + j * 0.12);
        lv.position.set(s * 0.18, -0.35 + j * 0.55, 0.05);
        leaf.add(lv);
      }
    }

    /* Lumières */
    scene.add(new THREE.AmbientLight(0xffffff, 0.55));
    var dir = new THREE.DirectionalLight(0xffffff, 1.3);
    dir.position.set(2, 3, 4);
    scene.add(dir);
    var pt = new THREE.PointLight(col, 2.0, 10);
    pt.position.set(-1.5, 1.5, 2);
    scene.add(pt);
    var back = new THREE.DirectionalLight(0x4ade80, 0.35);
    back.position.set(-2, -1, -3);
    scene.add(back);

    var frame; var t = 0;
    var animate = function() {
      frame = requestAnimationFrame(animate);
      t += 0.013;
      leaf.rotation.y = t * 0.55 + Math.sin(t * 0.35) * 0.28;
      leaf.rotation.x = Math.sin(t * 0.28) * 0.18;
      leaf.position.y  = Math.sin(t * 0.65) * 0.09;
      pt.intensity = 2.0 + Math.sin(t * 1.6) * 0.5;
      renderer.render(scene, camera);
    };
    animate();

    return function() {
      cancelAnimationFrame(frame);
      renderer.dispose();
      geo.dispose(); mat.dispose(); veinMat.dispose();
    };
  }, [niveau]);
  return React.createElement('canvas', { ref: canvasRef, style: { width: '100%', height: '180px', display: 'block' } });
}
