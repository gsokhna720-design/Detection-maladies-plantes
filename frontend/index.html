<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>PlantAI — Student Plant Monitor</title>
  <link rel="manifest" href="/manifest.json"/>
  <meta name="theme-color" content="#16a34a"/>
  <link rel="icon" href="/icons/favicon-32.png" sizes="32x32"/>
  <link rel="apple-touch-icon" href="/icons/icon-180.png"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="PlantAI"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.development.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.development.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');

    :root {
      --green:      #1db954;
      --green-dark: #159a42;
      --green-deep: #0d6e2e;
      --green-pale: #e8f8ed;
      --green-mid:  #d1f2dc;
      --bg:         #f7f9fc;
      --white:      #ffffff;
      --border:     #e2e8f0;
      --border2:    #cbd5e1;
      --text:       #0f172a;
      --text2:      #475569;
      --text3:      #94a3b8;
      --orange:     #f59e0b;
      --red:        #ef4444;
      --blue:       #3b82f6;
      --shadow-sm:  0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
      --shadow:     0 4px 16px rgba(0,0,0,0.08);
      --shadow-lg:  0 12px 40px rgba(0,0,0,0.12);
      --shadow-green: 0 8px 32px rgba(29,185,84,0.22);
    }

    /* ══════════ MODE SOMBRE ══════════ */
    body.dark {
      --bg:         #0f1117;
      --white:      #1a1d27;
      --border:     #2a2d3a;
      --border2:    #3a3d4a;
      --text:       #f1f5f9;
      --text2:      #94a3b8;
      --text3:      #475569;
      --green-pale: #0d2e1a;
      --green-mid:  #0a2015;
      --shadow-sm:  0 1px 3px rgba(0,0,0,0.3), 0 1px 2px rgba(0,0,0,0.2);
      --shadow:     0 4px 16px rgba(0,0,0,0.4);
      --shadow-lg:  0 12px 40px rgba(0,0,0,0.5);
    }
    body.dark ::-webkit-scrollbar-track { background: #1a1d27; }
    body.dark ::-webkit-scrollbar-thumb { background: #2a2d3a; }

    /* Bouton dark mode toggle */
    .btn-theme {
      width: 38px; height: 38px; border-radius: 10px;
      border: 1.5px solid var(--border); background: var(--white);
      color: var(--text2); font-size: 1.05rem;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      transition: all 0.2s; flex-shrink: 0;
    }
    .btn-theme:hover { background: var(--green-pale); border-color: var(--green); transform: rotate(15deg) scale(1.05); }

    /* Transition douce sur tout le body */
    body { transition: background 0.3s, color 0.3s; }
    .navbar, .chart-card, .metric-card, .hero-banner, .upload-zone,
    .alert-modal, .note-modal, .result-card, .rc-body, .login-right,
    .login-input, .note-textarea {
      transition: background 0.3s, border-color 0.3s, color 0.3s, box-shadow 0.3s;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: #f1f5f9; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }

    /* ══════════ TOP NAVBAR ══════════ */
    .navbar {
      background: var(--white);
      border-bottom: 1.5px solid var(--border);
      padding: 0 32px;
      height: 64px;
      display: flex;
      align-items: center;
      gap: 16px;
      position: sticky;
      top: 0;
      z-index: 999;
      box-shadow: var(--shadow-sm);
    }
    .nav-brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .nav-logo {
      width: 36px;
      height: 36px;
      background: linear-gradient(135deg, var(--green), var(--green-dark));
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      box-shadow: 0 2px 8px rgba(29,185,84,0.35);
    }
    .nav-title {
      font-size: 0.78rem;
      font-weight: 800;
      color: var(--text);
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }
    .nav-subtitle { font-size: 0.65rem; color: var(--text3); margin-top: 1px; }

    .nav-sep { flex: 1; }

    .nav-tabs { display: flex; gap: 2px; }
    .nav-tab {
      padding: 7px 16px;
      border-radius: 8px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      color: var(--text2);
      transition: all 0.18s;
      border: none;
      background: none;
    }
    .nav-tab:hover  { background: var(--green-pale); color: var(--green-dark); }
    .nav-tab.active { background: linear-gradient(135deg, var(--green), var(--green-dark)); color: #fff; box-shadow: 0 2px 10px rgba(29,185,84,0.3); }

    .nav-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      background: var(--green-pale);
      border: 1.5px solid #a7f3c3;
      border-radius: 20px;
      padding: 5px 13px;
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--green-dark);
      margin-left: 8px;
    }
    .pulse-dot {
      width: 7px; height: 7px; border-radius: 50%; background: var(--green);
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%,100% { box-shadow: 0 0 0 0 rgba(29,185,84,0.4); }
      50%      { box-shadow: 0 0 0 5px rgba(29,185,84,0); }
    }

    .nav-time {
      font-size: 0.72rem;
      color: var(--text3);
      font-weight: 500;
      margin-left: 4px;
    }

    .btn-pdf {
      display: flex; align-items: center; gap: 6px;
      padding: 6px 14px; border-radius: 8px;
      background: linear-gradient(135deg, #ef4444, #b91c1c);
      color: #fff; border: none; cursor: pointer;
      font-size: 0.78rem; font-weight: 700;
      transition: all 0.2s; white-space: nowrap;
      box-shadow: 0 2px 8px rgba(239,68,68,0.3);
    }
    .btn-pdf:hover { transform: translateY(-1px); box-shadow: 0 4px 14px rgba(239,68,68,0.4); }
    .btn-pdf:active { transform: translateY(0); }
    .btn-pdf:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    /* Toast notification */
    .toast {
      position: fixed; bottom: 28px; right: 28px; z-index: 9999;
      background: var(--text); color: #fff;
      padding: 12px 20px; border-radius: 12px;
      font-size: 0.82rem; font-weight: 600;
      display: flex; align-items: center; gap: 8px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.2);
      animation: slideUp 0.3s ease;
    }
    .toast.success { background: #16a34a; }
    .toast.error   { background: #dc2626; }
    @keyframes slideUp { from { opacity:0; transform: translateY(20px); } to { opacity:1; transform: translateY(0); } }

    /* ── Alerte critique ── */
    .alert-overlay {
      position: fixed; inset: 0; z-index: 10000;
      background: rgba(0,0,0,0.55); backdrop-filter: blur(4px);
      display: flex; align-items: center; justify-content: center;
      animation: fadeIn 0.2s ease;
    }
    @keyframes fadeIn { from{opacity:0} to{opacity:1} }

    .alert-modal {
      background: #fff; border-radius: 20px; padding: 0;
      width: 420px; max-width: 92vw; overflow: hidden;
      box-shadow: 0 24px 64px rgba(0,0,0,0.25);
      animation: popIn 0.3s cubic-bezier(0.34,1.56,0.64,1);
    }
    @keyframes popIn { from{opacity:0;transform:scale(0.85)} to{opacity:1;transform:scale(1)} }

    .alert-header {
      padding: 22px 24px 18px;
      display: flex; align-items: flex-start; gap: 14px;
    }
    .alert-header.critical { background: linear-gradient(135deg,#ef4444,#b91c1c); }
    .alert-header.sick     { background: linear-gradient(135deg,#f59e0b,#d97706); }

    .alert-icon-wrap {
      width: 52px; height: 52px; border-radius: 14px;
      background: rgba(255,255,255,0.2);
      display: flex; align-items: center; justify-content: center;
      font-size: 1.8rem; flex-shrink: 0;
      animation: shake 0.5s ease 0.3s;
    }
    @keyframes shake {
      0%,100%{transform:rotate(0)} 20%{transform:rotate(-8deg)} 40%{transform:rotate(8deg)}
      60%{transform:rotate(-5deg)} 80%{transform:rotate(5deg)}
    }
    .alert-header-text h3 { font-size: 1.1rem; font-weight: 800; color: #fff; margin-bottom: 4px; }
    .alert-header-text p  { font-size: 0.8rem; color: rgba(255,255,255,0.8); line-height: 1.4; }

    .alert-body { padding: 20px 24px; }
    .alert-disease {
      font-size: 1.3rem; font-weight: 900; color: #0f172a;
      margin-bottom: 6px; display: flex; align-items: center; gap: 8px;
    }
    .alert-conf {
      font-size: 0.82rem; color: #64748b; margin-bottom: 16px;
      display: flex; align-items: center; gap: 8px;
    }
    .alert-conf-bar { flex:1; height: 6px; background: #f1f5f9; border-radius: 10px; overflow: hidden; }
    .alert-conf-fill { height: 100%; border-radius: 10px; transition: width 0.8s; }
    .alert-conseil {
      background: #fef9c3; border-left: 3px solid #f59e0b;
      border-radius: 0 8px 8px 0; padding: 10px 14px;
      font-size: 0.8rem; color: #78350f; line-height: 1.5; margin-bottom: 18px;
    }
    .alert-conseil.critical { background: #fee2e2; border-color: #ef4444; color: #7f1d1d; }

    .alert-actions { display: flex; gap: 10px; }
    .alert-btn-dismiss {
      flex: 1; padding: 10px; border-radius: 10px; border: 1.5px solid #e2e8f0;
      background: #fff; color: #475569; font-size: 0.85rem; font-weight: 600;
      cursor: pointer; transition: all 0.18s;
    }
    .alert-btn-dismiss:hover { background: #f8fafc; border-color: #cbd5e1; }
    .alert-btn-view {
      flex: 1; padding: 10px; border-radius: 10px; border: none;
      background: linear-gradient(135deg,#1db954,#16a34a);
      color: #fff; font-size: 0.85rem; font-weight: 700;
      cursor: pointer; transition: all 0.18s;
      box-shadow: 0 2px 8px rgba(29,185,84,0.3);
    }
    .alert-btn-view:hover { transform: translateY(-1px); box-shadow: 0 4px 14px rgba(29,185,84,0.4); }

    /* Badge alerte navbar */
    .alert-badge {
      display: inline-flex; align-items: center; justify-content: center;
      width: 18px; height: 18px; border-radius: 50%;
      background: #ef4444; color: #fff;
      font-size: 0.65rem; font-weight: 800;
      margin-left: 6px; animation: pulse 1.5s infinite;
    }

    /* Barre d'alerte sticky */
    .alert-bar {
      background: linear-gradient(135deg,#ef4444,#b91c1c);
      color: #fff; padding: 9px 28px;
      display: flex; align-items: center; gap: 10px;
      font-size: 0.82rem; font-weight: 600;
      animation: slideDown 0.3s ease;
    }
    @keyframes slideDown { from{opacity:0;transform:translateY(-100%)} to{opacity:1;transform:translateY(0)} }
    .alert-bar-close {
      margin-left: auto; background: rgba(255,255,255,0.2); border: none;
      color: #fff; border-radius: 6px; padding: 2px 8px; cursor: pointer;
      font-size: 0.78rem; font-weight: 700;
    }

    /* ══════════ LAYOUT ══════════ */
    .page { max-width: 1400px; margin: 0 auto; padding: 28px 32px; }

    /* ══════════ HERO SECTION — Image style ══════════ */
    .hero-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 20px;
    }

    /* Grande bannière verte — Plant Health */
    .hero-banner {
      border-radius: 18px;
      padding: 28px 30px;
      position: relative;
      overflow: hidden;
      cursor: default;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .hero-banner:hover { transform: translateY(-2px); box-shadow: var(--shadow-lg); }
    /* Quand hero-banner est dans un TiltCard, le tilt gère tout */
    .tilt-wrap .hero-banner { transition: none; }
    .tilt-wrap .hero-banner:hover { transform: none; box-shadow: none; }
    .hero-banner.green  { background: linear-gradient(135deg, #1db954, #0d6e2e); box-shadow: var(--shadow-green); }
    .hero-banner.teal   { background: linear-gradient(135deg, #0ea5e9, #0369a1); box-shadow: 0 8px 32px rgba(14,165,233,0.22); }
    .hero-banner.orange { background: linear-gradient(135deg, #f59e0b, #d97706); box-shadow: 0 8px 32px rgba(245,158,11,0.22); }
    .hero-banner.red    { background: linear-gradient(135deg, #ef4444, #b91c1c); box-shadow: 0 8px 32px rgba(239,68,68,0.22); }

    .hb-bg-circle {
      position: absolute;
      border-radius: 50%;
      background: rgba(255,255,255,0.07);
    }
    .hb-bg-circle.c1 { width: 160px; height: 160px; top: -50px; right: -40px; }
    .hb-bg-circle.c2 { width: 90px;  height: 90px;  bottom: -25px; right: 60px; }

    .hb-label {
      font-size: 0.7rem;
      font-weight: 800;
      color: rgba(255,255,255,0.7);
      text-transform: uppercase;
      letter-spacing: 1.8px;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .hb-value {
      font-size: 2.1rem;
      font-weight: 900;
      color: #fff;
      line-height: 1.1;
      margin-bottom: 6px;
    }
    .hb-sub {
      font-size: 0.82rem;
      color: rgba(255,255,255,0.75);
      font-weight: 500;
    }
    .hb-pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: rgba(255,255,255,0.2);
      border: 1px solid rgba(255,255,255,0.3);
      border-radius: 20px;
      padding: 4px 12px;
      font-size: 0.72rem;
      font-weight: 700;
      color: #fff;
      margin-top: 12px;
    }
    .hb-conf {
      position: absolute;
      top: 24px;
      right: 28px;
      text-align: right;
    }
    .hb-conf-val   { font-size: 2.6rem; font-weight: 900; color: #fff; line-height: 1; }
    .hb-conf-label { font-size: 0.7rem; color: rgba(255,255,255,0.65); font-weight: 600; text-transform: uppercase; letter-spacing: 1px; margin-top: 2px; }

    /* ══════════ SMALL METRICS ROW ══════════ */
    .metrics-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
      margin-bottom: 20px;
    }
    .metric-card {
      background: var(--white);
      border: 1.5px solid var(--border);
      border-radius: 14px;
      padding: 16px 18px;
      display: flex;
      align-items: center;
      gap: 14px;
      box-shadow: var(--shadow-sm);
      transition: all 0.2s;
      cursor: default;
    }
    .metric-card:hover { box-shadow: var(--shadow); transform: translateY(-1px); }
    .metric-icon {
      width: 44px; height: 44px; border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.3rem; flex-shrink: 0;
    }
    .metric-val   { font-size: 1.5rem; font-weight: 900; line-height: 1; }
    .metric-label { font-size: 0.72rem; color: var(--text3); margin-top: 3px; font-weight: 500; }
    .metric-trend { font-size: 0.68rem; font-weight: 700; margin-top: 4px; }
    .trend-up   { color: var(--green); }
    .trend-down { color: var(--red); }
    .trend-flat { color: var(--text3); }

    /* ══════════ CHARTS ROW — Image sparklines ══════════ */
    .charts-row {
      display: grid;
      grid-template-columns: 2fr 1fr 1fr 1fr;
      gap: 14px;
      margin-bottom: 20px;
    }
    .chart-card {
      background: var(--white);
      border: 1.5px solid var(--border);
      border-radius: 14px;
      padding: 18px 18px 14px;
      box-shadow: var(--shadow-sm);
    }
    .cc-head { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 2px; }
    .cc-title { font-size: 0.82rem; font-weight: 700; color: var(--text); }
    .cc-period {
      font-size: 0.65rem;
      color: var(--text3);
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 2px 8px;
      font-weight: 600;
    }
    .cc-val { font-size: 1.6rem; font-weight: 900; color: var(--text); line-height: 1; margin-bottom: 2px; }
    .cc-sub { font-size: 0.7rem; color: var(--text3); margin-bottom: 12px; }
    .sparkline-wrap { height: 70px; position: relative; }
    .chart-wrap-md { height: 190px; position: relative; }

    /* ══════════ MAIN BOTTOM GRID ══════════ */
    .bottom-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 14px;
      margin-bottom: 20px;
    }
    .bottom-grid .span2 { grid-column: span 2; }

    /* ══════════ UPLOAD ══════════ */
    .upload-zone {
      border: 2px dashed #b7e5c9;
      border-radius: 12px;
      padding: 24px 16px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
      background: var(--green-pale);
      position: relative;
    }
    .upload-zone:hover, .upload-zone.over {
      border-color: var(--green);
      background: var(--green-mid);
      box-shadow: 0 0 0 4px rgba(29,185,84,0.08);
    }
    .upload-zone input { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%; }
    .uz-icon { font-size: 2rem; margin-bottom: 6px; }
    .uz-text  { font-size: 0.82rem; color: var(--text2); line-height: 1.6; }
    .uz-text strong { color: var(--green-dark); }
    .preview-img { width: 100%; max-height: 160px; object-fit: cover; border-radius: 10px; margin-top: 10px; border: 2px solid #b7e5c9; }

    .btn-primary {
      width: 100%; margin-top: 12px; padding: 11px 16px;
      background: linear-gradient(135deg, var(--green), var(--green-dark));
      color: #fff; border: none; border-radius: 10px;
      font-size: 0.88rem; font-weight: 700; cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      transition: all 0.2s;
      box-shadow: 0 3px 12px rgba(29,185,84,0.3);
      letter-spacing: 0.3px;
    }
    .btn-primary:hover:not(:disabled) { transform: translateY(-1px); box-shadow: var(--shadow-green); }
    .btn-primary:disabled { opacity: 0.45; cursor: not-allowed; transform: none; box-shadow: none; }
    .spinner { width: 16px; height: 16px; border: 2.5px solid rgba(255,255,255,0.4); border-top-color: #fff; border-radius: 50%; animation: spin 0.7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ══════════ RESULT ══════════ */
    .result-idle { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 160px; color: var(--text3); gap: 6px; font-size: 0.8rem; text-align: center; }
    .result-card { border-radius: 12px; overflow: hidden; border: 1.5px solid var(--border); }
    #particle-bg  { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
    .page         { position: relative; z-index: 1; }
    .rc-header { padding: 14px 16px; display: flex; align-items: center; gap: 10px; }
    .rc-header.healthy  { background: linear-gradient(135deg,#1db954,#0d6e2e); }
    .rc-header.sick     { background: linear-gradient(135deg,#f59e0b,#d97706); }
    .rc-header.critical { background: linear-gradient(135deg,#ef4444,#b91c1c); }
    .rc-header.unknown  { background: linear-gradient(135deg,#64748b,#334155); }
    .rc-header-name { font-size: 1rem; font-weight: 800; color: #fff; }
    .rc-body { padding: 14px 16px; background: #fff; }
    .rc-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; font-size: 0.8rem; }
    .rc-lbl { color: var(--text3); font-weight: 500; }
    .rc-val { font-weight: 700; color: var(--text); }
    .prog { flex: 1; margin: 0 10px; height: 6px; background: #f1f5f9; border-radius: 10px; overflow: hidden; }
    .prog-fill { height: 100%; border-radius: 10px; transition: width 1s ease; }
    .pill { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 0.7rem; font-weight: 700; }
    .pill-healthy  { background: var(--green-pale); color: var(--green-dark); }
    .pill-sick     { background: #fef3c7; color: #92400e; }
    .pill-critical { background: #fee2e2; color: #991b1b; }
    .pill-unknown  { background: #f1f5f9; color: #475569; }
    .rc-advice { margin-top: 10px; background: var(--green-pale); border-left: 3px solid var(--green); border-radius: 0 8px 8px 0; padding: 9px 12px; font-size: 0.76rem; color: var(--green-deep); line-height: 1.5; }

    /* ══════════ ANNOTATIONS ══════════ */
    .note-modal-overlay {
      position: fixed; inset: 0; z-index: 10000;
      background: rgba(0,0,0,0.45); backdrop-filter: blur(4px);
      display: flex; align-items: center; justify-content: center;
      animation: fadeIn 0.2s ease;
    }
    .note-modal {
      background: #fff; border-radius: 18px; width: 460px; max-width: 92vw;
      overflow: hidden; box-shadow: 0 24px 64px rgba(0,0,0,0.2);
      animation: popIn 0.25s cubic-bezier(0.34,1.56,0.64,1);
    }
    .note-modal-head {
      padding: 18px 22px 14px;
      border-bottom: 1.5px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
    }
    .note-modal-title { font-size: 0.95rem; font-weight: 800; color: var(--text); }
    .note-modal-sub   { font-size: 0.73rem; color: var(--text3); margin-top: 2px; }
    .note-modal-close {
      width: 28px; height: 28px; border-radius: 8px; border: 1.5px solid var(--border);
      background: #fff; cursor: pointer; font-size: 0.9rem; color: var(--text2);
      display: flex; align-items: center; justify-content: center; transition: all 0.15s;
    }
    .note-modal-close:hover { background: #fee2e2; border-color: #fca5a5; color: #dc2626; }
    .note-modal-body { padding: 18px 22px; }
    .note-disease-info {
      display: flex; align-items: center; gap: 10px; margin-bottom: 14px;
      background: var(--bg); border-radius: 10px; padding: 10px 14px;
    }
    .note-disease-icon { font-size: 1.3rem; }
    .note-disease-name { font-weight: 700; color: var(--text); font-size: 0.88rem; }
    .note-disease-date { font-size: 0.72rem; color: var(--text3); margin-top: 2px; }
    .note-textarea {
      width: 100%; min-height: 110px; padding: 12px 14px;
      border: 1.5px solid var(--border); border-radius: 10px;
      font-size: 0.85rem; font-family: 'Inter', sans-serif;
      color: var(--text); resize: vertical; transition: border-color 0.18s;
      outline: none; background: #fff;
    }
    .note-textarea:focus { border-color: var(--green); box-shadow: 0 0 0 3px rgba(29,185,84,0.1); }
    .note-textarea::placeholder { color: var(--text3); }
    .note-char-count { text-align: right; font-size: 0.68rem; color: var(--text3); margin-top: 4px; }
    .note-actions { display: flex; gap: 10px; margin-top: 14px; }
    .note-btn-cancel {
      flex:1; padding: 10px; border-radius: 10px; border: 1.5px solid var(--border);
      background: #fff; color: var(--text2); font-size: 0.85rem; font-weight: 600;
      cursor: pointer; transition: all 0.15s;
    }
    .note-btn-cancel:hover { background: var(--bg); }
    .note-btn-save {
      flex:1; padding: 10px; border-radius: 10px; border: none;
      background: linear-gradient(135deg, var(--green), var(--green-dark));
      color: #fff; font-size: 0.85rem; font-weight: 700; cursor: pointer;
      transition: all 0.18s; box-shadow: 0 2px 8px rgba(29,185,84,0.3);
    }
    .note-btn-save:hover { transform: translateY(-1px); box-shadow: 0 4px 14px rgba(29,185,84,0.4); }

    /* Note inline dans le tableau */
    .note-inline {
      font-size: 0.72rem; color: var(--text2); margin-top: 4px;
      background: #fef9c3; border-radius: 5px; padding: 3px 7px;
      border-left: 2px solid var(--orange); max-width: 200px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .btn-note {
      padding: 3px 9px; border-radius: 7px; border: 1.5px solid var(--border);
      background: #fff; color: var(--text3); font-size: 0.7rem; font-weight: 600;
      cursor: pointer; transition: all 0.15s; white-space: nowrap;
    }
    .btn-note:hover { background: var(--green-pale); border-color: var(--green); color: var(--green-dark); }
    .btn-note.has-note { background: #fef9c3; border-color: #f59e0b; color: #92400e; }

    /* ══════════ TABLE ══════════ */
    .tbl-scroll { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 0.79rem; }
    thead th { background: var(--bg); color: var(--text3); font-weight: 700; padding: 8px 12px; text-align: left; font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.8px; border-bottom: 1.5px solid var(--border); }
    tbody tr { border-bottom: 1px solid #f1f5f9; transition: background 0.12s; }
    tbody tr:hover { background: var(--green-pale); }
    tbody td { padding: 9px 12px; color: var(--text2); }
    .td-bold { color: var(--text); font-weight: 700; }

    /* ══════════ DISEASE LIST ══════════ */
    .dl-item { display: flex; align-items: center; gap: 10px; padding: 7px 0; border-bottom: 1px solid #f1f5f9; }
    .dl-item:last-child { border-bottom: none; }
    .dl-dot  { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
    .dl-name { flex: 1; font-size: 0.78rem; color: var(--text2); font-weight: 500; }
    .dl-bar-bg { width: 64px; height: 5px; background: var(--bg); border-radius: 4px; overflow: hidden; }
    .dl-bar    { height: 100%; border-radius: 4px; transition: width 0.7s; }
    .dl-cnt    { font-size: 0.76rem; font-weight: 800; color: var(--text); min-width: 16px; text-align: right; }

    /* ══════════ SENSOR BARS ══════════ */
    .sensor-row { margin-bottom: 14px; }
    .sensor-row:last-child { margin-bottom: 0; }
    .sensor-head { display: flex; justify-content: space-between; margin-bottom: 5px; }
    .sensor-name { font-size: 0.76rem; color: var(--text2); font-weight: 600; display: flex; align-items: center; gap: 5px; }
    .sensor-val  { font-size: 0.8rem; font-weight: 800; }
    .sensor-bar  { height: 7px; background: #f1f5f9; border-radius: 10px; overflow: hidden; border: 1px solid var(--border); }
    .sensor-fill { height: 100%; border-radius: 10px; transition: width 0.9s ease; }

    /* ══════════ EMPTY ══════════ */
    .empty-box { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px 20px; color: var(--text3); text-align: center; }
    .empty-box .e-icon { font-size: 2.8rem; opacity: 0.35; margin-bottom: 10px; }
    .e-link { color: var(--green-dark); cursor: pointer; font-weight: 700; }

    /* ══════════ SECTION TITLE ══════════ */
    .section-title { font-size: 0.7rem; font-weight: 800; color: var(--text3); text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
    .section-title::after { content:''; flex:1; height:1px; background:var(--border); }

    @media (max-width: 1200px) { .charts-row { grid-template-columns: 1fr 1fr; } .hero-grid { grid-template-columns: 1fr 1fr; } }
    @media (max-width: 900px)  { .metrics-row { grid-template-columns: 1fr 1fr; } .bottom-grid { grid-template-columns: 1fr; } .bottom-grid .span2 { grid-column: 1; } }
    @media (max-width: 600px)  { .hero-grid { grid-template-columns: 1fr; } .page { padding: 12px; } .navbar { padding: 0 12px; } }

    /* ══════════ RESPONSIVE MOBILE COMPLET ══════════ */

    /* Hamburger button */
    .nav-hamburger {
      display: none; flex-direction: column; gap: 5px;
      background: none; border: none; cursor: pointer; padding: 6px;
    }
    .nav-hamburger span {
      display: block; width: 22px; height: 2.5px; border-radius: 2px;
      background: var(--text2); transition: all 0.3s;
    }
    .nav-hamburger.open span:nth-child(1) { transform: translateY(7.5px) rotate(45deg); }
    .nav-hamburger.open span:nth-child(2) { opacity: 0; transform: scaleX(0); }
    .nav-hamburger.open span:nth-child(3) { transform: translateY(-7.5px) rotate(-45deg); }

    /* Menu mobile drawer */
    .mobile-menu {
      display: none;
      position: fixed; top: 64px; left: 0; right: 0; z-index: 998;
      background: var(--white); border-bottom: 2px solid var(--border);
      box-shadow: var(--shadow-lg);
      padding: 12px 16px 16px;
      animation: slideDown 0.25s ease;
      flex-direction: column; gap: 6px;
    }
    .mobile-menu.open { display: flex; }
    .mobile-tab {
      padding: 11px 16px; border-radius: 10px; border: none;
      background: none; font-size: 0.9rem; font-weight: 600;
      color: var(--text2); cursor: pointer; text-align: left;
      transition: all 0.15s; display: flex; align-items: center; gap: 10px;
    }
    .mobile-tab:hover  { background: var(--green-pale); color: var(--green-dark); }
    .mobile-tab.active { background: linear-gradient(135deg,var(--green),var(--green-dark)); color:#fff; }
    .mobile-menu-sep { height: 1px; background: var(--border); margin: 4px 0; }
    .mobile-menu-row { display: flex; gap: 8px; }
    .mobile-menu-row .mobile-tab { flex: 1; justify-content: center; }

    @media (max-width: 768px) {
      /* Cache les tabs desktop, montre le hamburger */
      .nav-tabs         { display: none !important; }
      .nav-badge        { display: none !important; }
      .nav-time         { display: none !important; }
      .btn-pdf          { display: none !important; }
      .btn-theme        { display: none !important; }
      .nav-profile-name, .nav-profile-role, .nav-chevron { display: none !important; }
      .nav-profile-btn  { padding: 4px; border-radius: 50%; }
      .nav-hamburger    { display: flex; }

      /* Page layout */
      .page { padding: 12px; }
      .hero-grid { grid-template-columns: 1fr !important; }
      .metrics-row { grid-template-columns: 1fr 1fr; }
      .charts-row  { grid-template-columns: 1fr !important; }
      .bottom-grid { grid-template-columns: 1fr !important; }
      .bottom-grid .span2 { grid-column: 1; }
      .stats-kpi-row { grid-template-columns: 1fr 1fr; }
      .stats-grid-top, .stats-grid-bot { grid-template-columns: 1fr !important; }

      /* Cartes héro : réduire padding */
      .hero-banner { padding: 18px 18px; }
      .hb-value    { font-size: 1.6rem; }
      .hb-conf-val { font-size: 2rem; }

      /* Navbar */
      .navbar { height: 56px; padding: 0 14px; gap: 10px; }
      .nav-logo { width: 30px; height: 30px; font-size: 0.9rem; }
      .nav-title { font-size: 0.7rem; }
      .nav-subtitle { display: none; }

      /* Profile dropdown — plein écran sur mobile */
      .profile-dropdown { left: 8px; right: 8px; width: auto; }

      /* Table scroll horizontal */
      .tbl-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
      table { min-width: 580px; }

      /* Charts hauteur réduite */
      .chart-wrap-md { height: 160px; }
      .sparkline-wrap { height: 55px; }

      /* Upload zone */
      .upload-zone { padding: 18px 12px; }

      /* Alert modal */
      .alert-modal { width: 95vw; }

      /* Stats KPI text */
      .stats-kpi-val { font-size: 1.7rem; }
    }

    @media (max-width: 420px) {
      .metrics-row  { grid-template-columns: 1fr; }
      .stats-kpi-row { grid-template-columns: 1fr; }
      .hb-value { font-size: 1.4rem; }
      .metric-val { font-size: 1.3rem; }
    }

    /* ══════════ SPLASH SCREEN ══════════ */
    .splash {
      position: fixed; inset: 0; z-index: 99999;
      background: linear-gradient(160deg, #0d6e2e 0%, #1db954 55%, #16a34a 100%);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      overflow: hidden;
    }
    .splash.fade-out {
      animation: splashFadeOut 0.7s ease forwards;
    }
    @keyframes splashFadeOut {
      from { opacity:1; transform: scale(1); }
      to   { opacity:0; transform: scale(1.04); }
    }

    /* Cercles décoratifs */
    .splash-circle {
      position: absolute; border-radius: 50%;
      background: rgba(255,255,255,0.06);
      animation: splashPulse 3s ease-in-out infinite;
    }
    .splash-circle.c1 { width:500px; height:500px; top:-120px; right:-120px; animation-delay:0s; }
    .splash-circle.c2 { width:320px; height:320px; bottom:-80px; left:-80px; animation-delay:0.5s; }
    .splash-circle.c3 { width:200px; height:200px; top:60px; left:60px; animation-delay:1s; }
    @keyframes splashPulse {
      0%,100% { transform: scale(1); opacity:0.6; }
      50%      { transform: scale(1.08); opacity:1; }
    }

    /* Logo central */
    .splash-logo {
      position: relative; z-index: 1;
      display: flex; flex-direction: column; align-items: center; gap: 20px;
      animation: splashLogoIn 0.8s cubic-bezier(0.34,1.56,0.64,1) forwards;
    }
    @keyframes splashLogoIn {
      from { opacity:0; transform: scale(0.5) translateY(30px); }
      to   { opacity:1; transform: scale(1) translateY(0); }
    }
    .splash-icon-wrap {
      width: 110px; height: 110px; border-radius: 28px;
      background: rgba(255,255,255,0.18);
      border: 2px solid rgba(255,255,255,0.35);
      display: flex; align-items: center; justify-content: center;
      font-size: 3.8rem;
      box-shadow: 0 16px 48px rgba(0,0,0,0.2), inset 0 1px 0 rgba(255,255,255,0.3);
      animation: splashIconFloat 2s ease-in-out infinite 0.8s;
    }
    @keyframes splashIconFloat {
      0%,100% { transform: translateY(0) rotate(0deg); }
      50%      { transform: translateY(-10px) rotate(3deg); }
    }
    .splash-title {
      font-size: 2.8rem; font-weight: 900; color: #fff;
      letter-spacing: -1px; text-align: center;
      text-shadow: 0 4px 20px rgba(0,0,0,0.2);
      animation: splashTextIn 0.6s ease 0.3s both;
    }
    .splash-subtitle {
      font-size: 1rem; color: rgba(255,255,255,0.8); font-weight: 500;
      text-align: center; letter-spacing: 0.5px;
      animation: splashTextIn 0.6s ease 0.5s both;
    }
    @keyframes splashTextIn {
      from { opacity:0; transform: translateY(15px); }
      to   { opacity:1; transform: translateY(0); }
    }

    /* Barre de chargement */
    .splash-bar-wrap {
      position: relative; z-index: 1; margin-top: 40px;
      width: 220px;
      animation: splashTextIn 0.6s ease 0.7s both;
    }
    .splash-bar-track {
      height: 5px; background: rgba(255,255,255,0.2);
      border-radius: 10px; overflow: hidden;
    }
    .splash-bar-fill {
      height: 100%; border-radius: 10px;
      background: rgba(255,255,255,0.9);
      animation: splashBarGrow 2.2s cubic-bezier(0.4,0,0.2,1) 0.3s forwards;
      width: 0%;
    }
    @keyframes splashBarGrow {
      0%   { width:0%; }
      40%  { width:55%; }
      70%  { width:80%; }
      90%  { width:95%; }
      100% { width:100%; }
    }
    .splash-status {
      margin-top: 10px; font-size: 0.75rem; color: rgba(255,255,255,0.65);
      text-align: center; font-weight: 500; height: 18px;
      animation: splashTextIn 0.6s ease 0.7s both;
    }

    /* Tags techno en bas */
    .splash-tags {
      position: relative; z-index: 1; margin-top: 32px;
      display: flex; gap: 10px; flex-wrap: wrap; justify-content: center;
      animation: splashTextIn 0.6s ease 0.9s both;
    }
    .splash-tag {
      padding: 5px 14px; border-radius: 20px;
      background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.25);
      font-size: 0.72rem; font-weight: 700; color: #fff;
      letter-spacing: 0.5px;
    }

    /* ══════════ TILT 3D CARDS ══════════ */
    .tilt-wrap {
      transform-style: preserve-3d;
      transition: transform 0.1s ease, box-shadow 0.1s ease;
      will-change: transform;
      position: relative;
    }
    .tilt-wrap:hover { z-index: 10; }
    .tilt-glare {
      position: absolute; inset: 0; border-radius: inherit;
      pointer-events: none; overflow: hidden; z-index: 2;
      border-radius: 18px;
    }
    .tilt-glare::after {
      content: '';
      position: absolute; inset: -50%;
      background: radial-gradient(circle at var(--mx,50%) var(--my,50%),
        rgba(255,255,255,0.18) 0%,
        rgba(255,255,255,0.06) 35%,
        transparent 65%);
      transition: opacity 0.3s;
      opacity: 0;
    }
    .tilt-wrap:hover .tilt-glare::after { opacity: 1; }

    /* ══════════ DARK MODE OVERRIDES ══════════ */
    body.dark thead th        { background: #13161f; color: var(--text3); border-bottom-color: var(--border); }
    body.dark tbody tr:hover  { background: #1a1d27; }
    body.dark tbody tr        { border-bottom-color: var(--border); }
    body.dark .upload-zone    { background: #13161f; border-color: #2a3a2e; }
    body.dark .upload-zone:hover, body.dark .upload-zone.over { background: #0d2e1a; border-color: var(--green); }
    body.dark .login-input    { background: #13161f; color: var(--text); border-color: var(--border); }
    body.dark .login-input:focus { border-color: var(--green); }
    body.dark .note-textarea  { background: #13161f; color: var(--text); border-color: var(--border); }
    body.dark .alert-modal    { background: #1a1d27; }
    body.dark .alert-body     { background: #1a1d27; }
    body.dark .alert-btn-dismiss { background: #13161f; border-color: var(--border); color: var(--text2); }
    body.dark .note-modal     { background: #1a1d27; }
    body.dark .note-modal-head{ border-bottom-color: var(--border); }
    body.dark .note-disease-info { background: #13161f; }
    body.dark .note-btn-cancel { background: #13161f; border-color: var(--border); color: var(--text2); }
    body.dark .rc-body        { background: #1a1d27; }
    body.dark .result-card    { border-color: var(--border); }
    body.dark .prog           { background: #2a2d3a; }
    body.dark .sensor-bar     { background: #2a2d3a; border-color: var(--border); }
    body.dark .dl-bar-bg      { background: #2a2d3a; }
    body.dark .cc-period      { background: #13161f; border-color: var(--border); }
    body.dark .nav-tab:hover  { background: #0d2e1a; }
    body.dark .alert-bar-close { background: rgba(255,255,255,0.15); }
    body.dark .note-inline    { background: #2a2010; border-left-color: var(--orange); }
    body.dark .btn-note       { background: #13161f; border-color: var(--border); color: var(--text3); }
    body.dark .btn-note.has-note { background: #2a2010; border-color: #92400e; color: #fbbf24; }
    body.dark .rc-advice      { background: #0d2e1a; border-left-color: var(--green); color: #6ee7a0; }
    body.dark .login-hint     { background: #0d2e1a; border-color: #1a4a2a; color: #6ee7a0; }
    body.dark .login-remember { color: var(--text2); }
    body.dark .login-footer   { color: var(--text3); }
    body.dark .login-logo-text h1 { color: var(--text); }
    body.dark .login-sub, body.dark .login-title { color: var(--text); }

    /* ══════════ PAGE MALADIES ══════════ */
    .mal-intro { background: linear-gradient(135deg,#16a34a,#1db954); color:#fff; border-radius: 16px; padding: 28px 32px; margin-bottom: 20px; }
    .mal-intro h2 { font-size: 1.4rem; font-weight: 800; margin: 0 0 6px; }
    .mal-intro p { opacity: .88; font-size: 0.9rem; margin: 0; }
    .mal-stats-row { display: flex; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
    .mal-stat { flex: 1; min-width: 120px; background: var(--white); border: 1px solid var(--border); border-radius: 12px; padding: 16px 18px; text-align: center; }
    .mal-stat .ms-val { font-size: 1.8rem; font-weight: 900; color: var(--green); }
    .mal-stat .ms-lbl { font-size: 0.72rem; color: var(--text3); margin-top: 2px; }
    .mal-culture { background: var(--white); border: 1px solid var(--border); border-radius: 14px; margin-bottom: 14px; overflow: hidden; }
    .mal-culture-head { display: flex; align-items: center; gap: 10px; padding: 14px 18px; border-bottom: 1px solid var(--border); cursor: pointer; user-select: none; }
    .mal-culture-head:hover { background: var(--bg); }
    .mal-culture-icon { font-size: 1.3rem; }
    .mal-culture-name { font-weight: 700; font-size: 0.95rem; flex: 1; }
    .mal-culture-count { font-size: 0.75rem; background: var(--green-pale); color: var(--green-dark); border-radius: 20px; padding: 2px 10px; font-weight: 600; }
    .mal-culture-chevron { color: var(--text3); transition: transform .2s; font-size: 0.8rem; }
    .mal-culture-chevron.open { transform: rotate(90deg); }
    .mal-disease-list { padding: 0 18px 14px; }
    .mal-disease-row { display: flex; align-items: flex-start; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--border); }
    .mal-disease-row:last-child { border-bottom: none; }
    .mal-niveau-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; margin-top: 4px; }
    .mal-niveau-dot.healthy  { background: #1db954; }
    .mal-niveau-dot.sick     { background: #f59e0b; }
    .mal-niveau-dot.critical { background: #ef4444; }
    .mal-disease-info { flex: 1; }
    .mal-disease-name { font-weight: 700; font-size: 0.85rem; }
    .mal-disease-desc { font-size: 0.75rem; color: var(--text2); margin-top: 2px; line-height: 1.45; }
    .mal-treatment { font-size: 0.75rem; background: #fef9c3; border-left: 3px solid #f59e0b; padding: 5px 10px; border-radius: 0 6px 6px 0; margin-top: 6px; color: #78350f; }
    .mal-treatment.critical { background: #fee2e2; border-color: #ef4444; color: #7f1d1d; }
    .mal-treatment.healthy  { background: #dcfce7; border-color: #1db954; color: #14532d; }
    .mal-legend { display: flex; gap: 18px; margin-bottom: 16px; flex-wrap: wrap; }
    .mal-legend-item { display: flex; align-items: center; gap: 6px; font-size: 0.78rem; color: var(--text2); }
    .sensor-iot-badge { display:inline-flex; align-items:center; gap:5px; background:var(--green-pale); color:var(--green-dark); border:1px solid #a7f3c3; border-radius:20px; padding:3px 10px; font-size:0.73rem; font-weight:700; }
    .sensor-real-indicator { position:absolute; top:8px; right:10px; font-size:0.65rem; background:#16a34a; color:#fff; border-radius:10px; padding:2px 7px; font-weight:700; }
    body.dark .mal-culture    { background: #13161f; border-color: var(--border); }
    body.dark .mal-stat       { background: #13161f; border-color: var(--border); }
    body.dark .mal-treatment  { background: #2a2010; color: #fbbf24; }
    body.dark .mal-treatment.critical { background: #2d0a0a; color: #fca5a5; }
    body.dark .mal-treatment.healthy  { background: #0d2e1a; color: #6ee7a0; }
    body.dark .mal-culture-head:hover { background: #1a1d27; }

    /* ══════════ STATISTIQUES ══════════ */
    .stats-kpi-row {
      display: grid; grid-template-columns: repeat(4,1fr); gap: 14px; margin-bottom: 20px;
    }
    .stats-kpi {
      background: var(--white); border: 1.5px solid var(--border);
      border-radius: 16px; padding: 20px 22px;
      box-shadow: var(--shadow-sm); transition: all 0.2s; position: relative; overflow: hidden;
    }
    .stats-kpi:hover { transform: translateY(-2px); box-shadow: var(--shadow); }
    .stats-kpi-accent { position: absolute; top:0; left:0; right:0; height:4px; border-radius: 16px 16px 0 0; }
    .stats-kpi-icon { font-size: 1.6rem; margin-bottom: 10px; }
    .stats-kpi-val  { font-size: 2.2rem; font-weight: 900; line-height: 1; color: var(--text); }
    .stats-kpi-label{ font-size: 0.72rem; color: var(--text3); margin-top: 4px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.8px; }
    .stats-kpi-sub  { font-size: 0.72rem; font-weight: 700; margin-top: 8px; }

    .stats-grid-top {
      display: grid; grid-template-columns: 1.4fr 1fr; gap: 14px; margin-bottom: 14px;
    }
    .stats-grid-bot {
      display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 14px; margin-bottom: 20px;
    }

    /* Barre de maladie dans le classement */
    .disease-rank-item {
      display: flex; align-items: center; gap: 12px;
      padding: 9px 0; border-bottom: 1px solid var(--border);
    }
    .disease-rank-item:last-child { border-bottom: none; }
    .rank-num {
      width: 22px; height: 22px; border-radius: 7px;
      background: var(--bg); color: var(--text3);
      font-size: 0.68rem; font-weight: 800;
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .rank-num.top { background: linear-gradient(135deg,#f59e0b,#d97706); color:#fff; }
    .rank-name { flex:1; font-size: 0.8rem; font-weight: 600; color: var(--text); }
    .rank-bar-bg { width: 80px; height: 6px; background: var(--bg); border-radius: 4px; overflow: hidden; }
    .rank-bar-fill { height: 100%; border-radius: 4px; transition: width 0.8s ease; }
    .rank-count { font-size: 0.78rem; font-weight: 800; min-width: 28px; text-align: right; }

    /* Indicateur de santé global */
    .health-score-wrap {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 20px 0; gap: 6px;
    }
    .health-score-val { font-size: 3.5rem; font-weight: 900; line-height: 1; }
    .health-score-label { font-size: 0.78rem; color: var(--text3); font-weight: 600; }
    .health-score-ring {
      width: 120px; height: 120px; position: relative; margin: 10px 0;
    }
    .health-score-ring svg { transform: rotate(-90deg); }
    .ring-bg   { fill: none; stroke: var(--border); stroke-width: 10; }
    .ring-fill { fill: none; stroke-width: 10; stroke-linecap: round; transition: stroke-dashoffset 1s ease; }

    .stats-tip {
      background: var(--green-pale); border: 1px solid #a7f3c3; border-radius: 10px;
      padding: 12px 16px; font-size: 0.78rem; color: var(--green-deep); line-height: 1.6;
      display: flex; align-items: flex-start; gap: 10px; margin-top: 14px;
    }
    body.dark .stats-tip { background: #0d2e1a; border-color: #1a4a2a; color: #6ee7a0; }

    @media (max-width: 900px) {
      .stats-kpi-row { grid-template-columns: 1fr 1fr; }
      .stats-grid-top, .stats-grid-bot { grid-template-columns: 1fr; }
    }

    /* ══════════ PROFIL UTILISATEUR ══════════ */
    .nav-profile {
      position: relative;
    }
    .nav-profile-btn {
      display: flex; align-items: center; gap: 9px;
      padding: 5px 12px 5px 6px;
      border: 1.5px solid var(--border); border-radius: 24px;
      background: var(--white); cursor: pointer;
      transition: all 0.2s; white-space: nowrap;
    }
    .nav-profile-btn:hover { border-color: var(--green); box-shadow: 0 0 0 3px rgba(29,185,84,0.1); }
    .nav-avatar {
      width: 30px; height: 30px; border-radius: 50%;
      background: linear-gradient(135deg, var(--green), var(--green-dark));
      display: flex; align-items: center; justify-content: center;
      font-size: 0.82rem; font-weight: 800; color: #fff;
      flex-shrink: 0; box-shadow: 0 2px 6px rgba(29,185,84,0.3);
    }
    .nav-profile-name { font-size: 0.78rem; font-weight: 700; color: var(--text); }
    .nav-profile-role { font-size: 0.65rem; color: var(--text3); }
    .nav-chevron { font-size: 0.6rem; color: var(--text3); margin-left: 2px; transition: transform 0.2s; }
    .nav-chevron.open { transform: rotate(180deg); }

    /* Dropdown menu */
    .profile-dropdown {
      position: absolute; top: calc(100% + 10px); right: 0;
      width: 260px; background: var(--white);
      border: 1.5px solid var(--border); border-radius: 16px;
      box-shadow: var(--shadow-lg); z-index: 5000;
      animation: dropIn 0.2s cubic-bezier(0.34,1.3,0.64,1);
      overflow: hidden;
    }
    @keyframes dropIn { from{opacity:0;transform:translateY(-10px) scale(0.97)} to{opacity:1;transform:translateY(0) scale(1)} }

    .pd-header {
      padding: 18px 18px 14px;
      background: linear-gradient(135deg, var(--green), var(--green-dark));
      display: flex; align-items: center; gap: 13px;
    }
    .pd-avatar-lg {
      width: 46px; height: 46px; border-radius: 14px;
      background: rgba(255,255,255,0.2); border: 2px solid rgba(255,255,255,0.35);
      display: flex; align-items: center; justify-content: center;
      font-size: 1.3rem; font-weight: 900; color: #fff; flex-shrink: 0;
    }
    .pd-name  { font-size: 0.9rem; font-weight: 800; color: #fff; }
    .pd-email { font-size: 0.7rem; color: rgba(255,255,255,0.75); margin-top: 2px; word-break: break-all; }
    .pd-role-badge {
      display: inline-block; margin-top: 5px;
      background: rgba(255,255,255,0.2); border: 1px solid rgba(255,255,255,0.3);
      border-radius: 20px; padding: 2px 10px; font-size: 0.65rem; font-weight: 700; color: #fff;
    }

    .pd-body { padding: 10px 8px; }
    .pd-item {
      display: flex; align-items: center; gap: 11px;
      padding: 9px 10px; border-radius: 10px;
      font-size: 0.8rem; color: var(--text2); font-weight: 600;
      cursor: pointer; transition: all 0.15s;
    }
    .pd-item:hover { background: var(--green-pale); color: var(--green-dark); }
    .pd-item-icon { font-size: 1rem; width: 22px; text-align: center; flex-shrink: 0; }
    .pd-sep { height: 1px; background: var(--border); margin: 6px 10px; }
    .pd-item.danger:hover { background: #fee2e2; color: #dc2626; }

    .pd-stats {
      margin: 0 10px 8px; padding: 10px 12px;
      background: var(--bg); border-radius: 10px; border: 1px solid var(--border);
      display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; text-align: center;
    }
    .pd-stat-val   { font-size: 1.1rem; font-weight: 900; color: var(--text); }
    .pd-stat-label { font-size: 0.62rem; color: var(--text3); margin-top: 1px; }

    /* ══════════ LOGIN PAGE ══════════ */
    .login-page {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 1fr 1fr;
      background: var(--bg);
    }
    @media (max-width: 768px) { .login-page { grid-template-columns: 1fr; } .login-left { display: none !important; } }

    /* Panneau gauche illustré */
    .login-left {
      background: linear-gradient(160deg, #0d6e2e 0%, #1db954 50%, #16a34a 100%);
      display: flex; flex-direction: column;
      justify-content: center; align-items: center;
      padding: 48px; position: relative; overflow: hidden;
    }
    .login-left::before {
      content: ''; position: absolute; inset: 0;
      background: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.05'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
    }
    .login-left-circle1 {
      position: absolute; width: 380px; height: 380px; border-radius: 50%;
      background: rgba(255,255,255,0.06); top: -80px; right: -80px;
    }
    .login-left-circle2 {
      position: absolute; width: 250px; height: 250px; border-radius: 50%;
      background: rgba(255,255,255,0.05); bottom: -60px; left: -60px;
    }
    .login-particles-canvas {
      position: absolute; inset: 0; width: 100%; height: 100%;
      z-index: 0; pointer-events: none;
    }
    .login-left-content { position: relative; z-index: 2; text-align: center; }
    .login-left-icon {
      font-size: 4.5rem; margin-bottom: 20px;
      filter: drop-shadow(0 8px 24px rgba(0,0,0,0.2));
      animation: floatIcon 3s ease-in-out infinite;
    }
    @keyframes floatIcon { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-12px)} }
    .login-left h2 { font-size: 2rem; font-weight: 900; color: #fff; margin-bottom: 10px; line-height: 1.2; }
    .login-left p  { font-size: 0.92rem; color: rgba(255,255,255,0.8); line-height: 1.6; max-width: 300px; }
    .login-features { margin-top: 32px; display: flex; flex-direction: column; gap: 12px; }
    .login-feature {
      display: flex; align-items: center; gap: 12px;
      background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.2);
      border-radius: 12px; padding: 12px 16px; text-align: left;
    }
    .login-feature-icon { font-size: 1.3rem; flex-shrink: 0; }
    .login-feature-text strong { display: block; font-size: 0.82rem; font-weight: 700; color: #fff; }
    .login-feature-text span   { font-size: 0.72rem; color: rgba(255,255,255,0.7); }

    /* Panneau droit — formulaire */
    .login-right {
      display: flex; flex-direction: column;
      justify-content: center; align-items: center;
      padding: 48px 40px;
      animation: fadeInRight 0.5s ease;
    }
    @keyframes fadeInRight { from{opacity:0;transform:translateX(30px)} to{opacity:1;transform:translateX(0)} }
    .login-form-wrap { width: 100%; max-width: 380px; }

    .login-logo {
      display: flex; align-items: center; gap: 10px; margin-bottom: 36px;
    }
    .login-logo-icon {
      width: 44px; height: 44px; border-radius: 12px;
      background: linear-gradient(135deg, var(--green), var(--green-dark));
      display: flex; align-items: center; justify-content: center;
      font-size: 1.4rem; box-shadow: 0 4px 14px rgba(29,185,84,0.35);
    }
    .login-logo-text h1 { font-size: 1.3rem; font-weight: 900; color: var(--text); }
    .login-logo-text p  { font-size: 0.68rem; color: var(--text3); margin-top: 1px; text-transform: uppercase; letter-spacing: 1px; }

    .login-title { font-size: 1.6rem; font-weight: 900; color: var(--text); margin-bottom: 6px; }
    .login-sub   { font-size: 0.85rem; color: var(--text2); margin-bottom: 28px; }

    .login-field { margin-bottom: 16px; }
    .login-field label {
      display: block; font-size: 0.78rem; font-weight: 700;
      color: var(--text); margin-bottom: 6px;
    }
    .login-input-wrap { position: relative; }
    .login-input-icon {
      position: absolute; left: 13px; top: 50%; transform: translateY(-50%);
      font-size: 1rem; pointer-events: none;
    }
    .login-input {
      width: 100%; padding: 11px 14px 11px 38px;
      border: 1.5px solid var(--border); border-radius: 10px;
      font-size: 0.88rem; font-family: 'Inter', sans-serif;
      color: var(--text); background: #fff; outline: none;
      transition: border-color 0.18s, box-shadow 0.18s;
    }
    .login-input:focus { border-color: var(--green); box-shadow: 0 0 0 3px rgba(29,185,84,0.12); }
    .login-input.error { border-color: var(--red); box-shadow: 0 0 0 3px rgba(239,68,68,0.1); }
    .login-pw-toggle {
      position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
      background: none; border: none; cursor: pointer; font-size: 1rem; color: var(--text3);
      padding: 2px;
    }

    .login-remember {
      display: flex; align-items: center; gap: 8px; margin-bottom: 20px;
      font-size: 0.8rem; color: var(--text2); cursor: pointer;
    }
    .login-remember input { accent-color: var(--green); width: 15px; height: 15px; cursor: pointer; }

    .btn-login {
      width: 100%; padding: 13px; border: none; border-radius: 11px;
      background: linear-gradient(135deg, var(--green), var(--green-dark));
      color: #fff; font-size: 0.95rem; font-weight: 800; cursor: pointer;
      transition: all 0.2s; box-shadow: 0 4px 16px rgba(29,185,84,0.35);
      display: flex; align-items: center; justify-content: center; gap: 8px;
      letter-spacing: 0.3px;
    }
    .btn-login:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 6px 22px rgba(29,185,84,0.45); }
    .btn-login:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

    .login-error {
      background: #fee2e2; border: 1px solid #fca5a5; border-radius: 9px;
      padding: 10px 14px; font-size: 0.8rem; color: #dc2626; font-weight: 600;
      margin-bottom: 14px; display: flex; align-items: center; gap: 7px;
      animation: shake2 0.4s ease;
    }
    @keyframes shake2 { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-6px)} 75%{transform:translateX(6px)} }

    .login-hint {
      margin-top: 20px; padding: 12px 16px;
      background: var(--green-pale); border-radius: 10px; border: 1px solid #a7f3c3;
      font-size: 0.75rem; color: var(--green-deep); line-height: 1.6;
    }
    .login-hint strong { font-weight: 700; }
    .login-footer {
      margin-top: 28px; text-align: center; font-size: 0.72rem; color: var(--text3);
    }

    /* Animation entrée dashboard */
    .dashboard-enter { animation: dashEnter 0.4s ease; }
    @keyframes dashEnter { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }

    /* ══════════ CURSOR TRAIL ══════════ */
    #cursor-canvas {
      position: fixed; inset: 0; z-index: 999999;
      pointer-events: none;
    }

    /* ══════════ SCAN ANIMATION ══════════ */
    .scan-wrap { position: relative; overflow: hidden; border-radius: 10px; }
    .scan-beam {
      position: absolute; left: 0; right: 0; top: 0; height: 3px;
      background: linear-gradient(90deg, transparent 0%, #1db954 20%, #4ade80 50%, #1db954 80%, transparent 100%);
      box-shadow: 0 0 16px 4px rgba(29,185,84,0.9), 0 0 40px 8px rgba(29,185,84,0.4);
      animation: scanBeam 1.6s cubic-bezier(0.4,0,0.6,1) infinite;
      z-index: 5;
    }
    @keyframes scanBeam {
      0%   { top: 0%; opacity: 0; }
      5%   { opacity: 1; }
      95%  { opacity: 0.8; }
      100% { top: 100%; opacity: 0; }
    }
    .scan-grid {
      position: absolute; inset: 0; z-index: 3; pointer-events: none;
      background-image: linear-gradient(rgba(29,185,84,0.07) 1px, transparent 1px),
                        linear-gradient(90deg, rgba(29,185,84,0.07) 1px, transparent 1px);
      background-size: 22px 22px;
    }
    .scan-corner { position: absolute; width: 16px; height: 16px; z-index: 4; }
    .scan-corner.tl { top: 7px; left: 7px; border-top: 2px solid #4ade80; border-left: 2px solid #4ade80; }
    .scan-corner.tr { top: 7px; right: 7px; border-top: 2px solid #4ade80; border-right: 2px solid #4ade80; }
    .scan-corner.bl { bottom: 7px; left: 7px; border-bottom: 2px solid #4ade80; border-left: 2px solid #4ade80; }
    .scan-corner.br { bottom: 7px; right: 7px; border-bottom: 2px solid #4ade80; border-right: 2px solid #4ade80; }
    .scan-label {
      position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%);
      z-index: 6; background: rgba(0,0,0,0.65); color: #4ade80;
      font-size: 0.62rem; font-weight: 800; letter-spacing: 2px;
      padding: 3px 10px; border-radius: 20px; white-space: nowrap;
      animation: scanLabel 1.6s ease infinite;
    }
    @keyframes scanLabel { 0%,100%{opacity:0.6} 50%{opacity:1} }

    /* ══════════ ARC GAUGE ══════════ */
    .arc-gauge-wrap { display: flex; flex-direction: column; align-items: center; position: relative; }
    .arc-gauge-center {
      position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%);
      text-align: center; white-space: nowrap;
    }
    .arc-gauge-val { font-size: 1.7rem; font-weight: 900; line-height: 1; }
    .arc-gauge-lbl { font-size: 0.57rem; color: var(--text3); font-weight: 700; text-transform: uppercase; letter-spacing: 1px; margin-top: 1px; }

    /* ══════════ CONFETTI ══════════ */
    #confetti-canvas { position: fixed; inset: 0; z-index: 999998; pointer-events: none; }

    /* ══════════ COMMAND PALETTE ══════════ */
    .cmd-overlay {
      position: fixed; inset: 0; z-index: 100000;
      background: rgba(0,0,0,0.52); backdrop-filter: blur(8px);
      display: flex; align-items: flex-start; justify-content: center;
      padding-top: 12vh; animation: fadeIn 0.12s ease;
    }
    .cmd-box {
      width: 560px; max-width: 92vw; background: var(--white);
      border-radius: 18px; border: 1.5px solid var(--border);
      box-shadow: 0 32px 80px rgba(0,0,0,0.3); overflow: hidden;
      animation: popIn 0.2s cubic-bezier(0.34,1.3,0.64,1);
    }
    .cmd-input-row {
      display: flex; align-items: center; gap: 12px;
      padding: 14px 18px; border-bottom: 1.5px solid var(--border);
    }
    .cmd-search-icon { font-size: 1.1rem; color: var(--text3); flex-shrink: 0; }
    .cmd-input {
      flex: 1; border: none; outline: none; font-size: 0.97rem;
      font-family: 'Inter', sans-serif; color: var(--text);
      background: transparent; font-weight: 500;
    }
    .cmd-input::placeholder { color: var(--text3); font-weight: 400; }
    .cmd-esc {
      font-size: 0.65rem; color: var(--text3); background: var(--bg);
      border: 1px solid var(--border); border-radius: 5px;
      padding: 2px 7px; font-weight: 700; white-space: nowrap; font-family: monospace;
    }
    .cmd-results { padding: 8px; max-height: 360px; overflow-y: auto; }
    .cmd-section-lbl {
      font-size: 0.62rem; font-weight: 800; color: var(--text3);
      text-transform: uppercase; letter-spacing: 1.3px;
      padding: 10px 10px 5px;
    }
    .cmd-item {
      display: flex; align-items: center; gap: 12px;
      padding: 9px 12px; border-radius: 10px; cursor: pointer; transition: all 0.1s;
    }
    .cmd-item.selected, .cmd-item:hover { background: var(--green-pale); }
    .cmd-item.selected .cmd-item-name { color: var(--green-dark); }
    .cmd-item-icon { font-size: 1rem; width: 24px; text-align: center; flex-shrink: 0; }
    .cmd-item-name { font-size: 0.85rem; font-weight: 600; color: var(--text); flex: 1; }
    .cmd-item-desc { font-size: 0.7rem; color: var(--text3); white-space: nowrap; }
    .cmd-footer {
      padding: 8px 18px; border-top: 1.5px solid var(--border);
      display: flex; gap: 14px; font-size: 0.67rem; color: var(--text3); align-items: center;
    }
    .cmd-footer kbd {
      background: var(--bg); border: 1px solid var(--border2);
      border-radius: 4px; padding: 1px 5px;
      font-family: monospace; color: var(--text2); font-size: 0.67rem;
    }
    body.dark .cmd-box { background: #1a1d27; }
    body.dark .cmd-input-row, body.dark .cmd-footer { border-color: #2a2d3a; }
    body.dark .cmd-item.selected, body.dark .cmd-item:hover { background: #0d2e1a; }

    /* ══════════ ACHIEVEMENT TOAST ══════════ */
    .achievement-toast {
      position: fixed; top: 76px; right: 20px; z-index: 99998;
      background: var(--white); border: 1.5px solid var(--border);
      border-radius: 16px; overflow: hidden; width: 300px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.22);
      animation: achieveIn 0.45s cubic-bezier(0.34,1.56,0.64,1);
    }
    @keyframes achieveIn { from{opacity:0;transform:translateX(120%)} to{opacity:1;transform:translateX(0)} }
    .achieve-shimmer {
      height: 4px;
      background: linear-gradient(90deg,#f59e0b,#4ade80,#3b82f6,#f59e0b);
      background-size: 300%;
      animation: shimmerBar 2s linear infinite;
    }
    @keyframes shimmerBar { 0%{background-position:0%} 100%{background-position:300%} }
    .achieve-tag {
      padding: 3px 14px; background: linear-gradient(135deg,#f59e0b,#d97706);
      font-size: 0.6rem; font-weight: 800; color: #fff;
      text-transform: uppercase; letter-spacing: 1.5px;
    }
    .achieve-body { padding: 12px 14px; display: flex; align-items: center; gap: 12px; }
    .achieve-icon { font-size: 2rem; line-height: 1; flex-shrink: 0; }
    .achieve-title { font-size: 0.86rem; font-weight: 800; color: var(--text); }
    .achieve-desc  { font-size: 0.7rem; color: var(--text2); margin-top: 2px; line-height: 1.4; }
    .achieve-xp {
      display: inline-block; margin-top: 5px;
      font-size: 0.68rem; font-weight: 800;
      color: var(--green-dark); background: var(--green-pale);
      border-radius: 8px; padding: 1px 8px;
    }

    /* ══════════ SCROLL REVEAL ══════════ */
    .reveal { opacity: 0; transform: translateY(22px); transition: opacity 0.55s ease, transform 0.55s ease; }
    .reveal.visible { opacity: 1; transform: translateY(0); }
    .rv2 { transition-delay: 0.12s; }
    .rv3 { transition-delay: 0.24s; }
    .rv4 { transition-delay: 0.36s; }

    /* ══════════ FADE-IN-UP (CSS keyframe — toujours visible) ══════════ */
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(18px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .fade-in-up { animation: fadeInUp 0.5s ease both; }

    /* ══════════ LIVE TICKER ══════════ */
    .live-ticker {
      display: flex; align-items: center; gap: 7px; background: var(--bg);
      border: 1px solid var(--border); border-radius: 20px; padding: 4px 11px;
      font-size: 0.66rem; color: var(--text3); font-weight: 600;
      max-width: 190px; overflow: hidden;
    }
    .ticker-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); flex-shrink: 0; animation: pulse 2s infinite; }
    .ticker-text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; animation: tickFade 0.35s ease; }
    @keyframes tickFade { from{opacity:0;transform:translateY(5px)} to{opacity:1;transform:translateY(0)} }
    @media(max-width:1100px){ .live-ticker{display:none;} }

    /* ══════════ ANIMATED NUMBER ══════════ */
    .anim-num { font-variant-numeric: tabular-nums; display: inline; }

    /* ══════════ KB HINT BAR ══════════ */
    .kb-bar {
      display: flex; align-items: center; gap: 16px;
      padding: 5px 32px; font-size: 0.66rem; color: var(--text3);
      background: var(--bg); border-bottom: 1px solid var(--border);
      overflow-x: auto; white-space: nowrap;
    }
    .kb-bar kbd {
      background: var(--white); border: 1px solid var(--border2);
      border-radius: 4px; padding: 1px 6px;
      font-family: monospace; font-size: 0.66rem; color: var(--text2);
      box-shadow: 0 1px 0 var(--border2); margin: 0 2px;
    }
    .kb-bar-sep { color: var(--border2); }
    @media(max-width:900px){ .kb-bar{display:none;} }

    /* ══════════ GLASSMORPHISM — DARK MODE ══════════ */
    body.dark .chart-card {
      background: rgba(26,29,39,0.88);
      backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
      border-color: rgba(255,255,255,0.05);
    }
    body.dark .metric-card {
      background: rgba(26,29,39,0.88);
      backdrop-filter: blur(12px);
      border-color: rgba(255,255,255,0.05);
    }
    body.dark .stats-kpi {
      background: rgba(26,29,39,0.88);
      backdrop-filter: blur(12px);
      border-color: rgba(255,255,255,0.05);
    }
    body.dark .navbar {
      background: rgba(15,17,23,0.92);
      backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
      border-bottom-color: rgba(255,255,255,0.05);
    }

    /* ══════════ HEALTHY CELEBRATION ══════════ */
    @keyframes healthyPop {
      0%   { transform: scale(1); }
      30%  { transform: scale(1.06); }
      60%  { transform: scale(0.97); }
      100% { transform: scale(1); }
    }
    .healthy-pop { animation: healthyPop 0.5s ease; }

    /* ══════════ AMBIENT BG GLOW ══════════ */
    .ambient-glow {
      position: fixed; border-radius: 50%; filter: blur(100px);
      pointer-events: none; z-index: 0; transition: all 2.5s ease;
    }
    .ambient-glow.g1 { width: 600px; height: 600px; top: -200px; right: -150px; }
    .ambient-glow.g2 { width: 400px; height: 400px; bottom: -100px; left: -100px; }

    /* ══════════ ESP32-CAM BADGE ══════════ */
    .esp32-badge {
      display: flex; align-items: center; gap: 7px;
      border-radius: 20px; padding: 5px 13px;
      font-size: 0.72rem; font-weight: 700;
      cursor: pointer; transition: all 0.2s; border: 1.5px solid;
      white-space: nowrap; flex-shrink: 0;
    }
    .esp32-badge.connected {
      background: var(--green-pale); border-color: #a7f3c3; color: var(--green-dark);
    }
    .esp32-badge.disconnected {
      background: #fef2f2; border-color: #fecaca; color: #dc2626;
    }
    .esp32-badge.unconfigured {
      background: var(--white); border-color: var(--border); color: var(--text3);
    }
    .esp32-badge:hover { transform: translateY(-1px); box-shadow: var(--shadow); }
    .esp32-dot {
      width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0;
    }
    .esp32-dot.on  { background: #1db954; animation: pulse 2s infinite; }
    .esp32-dot.off { background: #ef4444; }
    .esp32-dot.grey { background: #94a3b8; }

    /* ══════════ ESP32 SETTINGS MODAL ══════════ */
    .esp32-modal-overlay {
      position: fixed; inset: 0; z-index: 10000;
      background: rgba(0,0,0,0.5); backdrop-filter: blur(6px);
      display: flex; align-items: center; justify-content: center;
      animation: fadeIn 0.2s;
    }
    .esp32-modal {
      background: var(--white); border-radius: 20px;
      width: 460px; max-width: 94vw; overflow: hidden;
      box-shadow: 0 24px 64px rgba(0,0,0,0.22);
      animation: popIn 0.3s cubic-bezier(0.34,1.56,0.64,1);
    }
    .esp32-modal-head {
      background: linear-gradient(135deg, #0f172a, #1e293b);
      padding: 22px 24px 18px;
      display: flex; align-items: center; gap: 14px;
    }
    .esp32-modal-icon {
      width: 48px; height: 48px; border-radius: 14px;
      background: rgba(29,185,84,0.2); border: 1.5px solid rgba(29,185,84,0.4);
      display: flex; align-items: center; justify-content: center;
      font-size: 1.5rem; flex-shrink: 0;
    }
    .esp32-modal-title { font-size: 1.05rem; font-weight: 800; color: #fff; margin-bottom: 3px; }
    .esp32-modal-sub   { font-size: 0.76rem; color: rgba(255,255,255,0.55); }
    .esp32-modal-close {
      margin-left: auto; background: rgba(255,255,255,0.1); border: none;
      color: rgba(255,255,255,0.7); width: 30px; height: 30px; border-radius: 8px;
      cursor: pointer; font-size: 1rem; transition: all 0.2s; flex-shrink: 0;
    }
    .esp32-modal-close:hover { background: rgba(255,255,255,0.2); color: #fff; }
    .esp32-modal-body  { padding: 22px 24px; }
    .esp32-label  { font-size: 0.78rem; font-weight: 700; color: var(--text); margin-bottom: 7px; }
    .esp32-input-wrap { display: flex; gap: 8px; }
    .esp32-ip-input {
      flex: 1; padding: 10px 14px; border-radius: 10px;
      border: 1.5px solid var(--border2); background: var(--bg);
      font-size: 0.9rem; font-family: monospace; color: var(--text);
      outline: none; transition: border-color 0.2s;
    }
    .esp32-ip-input:focus { border-color: var(--green); }
    .esp32-btn-test {
      padding: 10px 16px; border-radius: 10px; border: none;
      background: linear-gradient(135deg, #1db954, #16a34a);
      color: #fff; font-size: 0.82rem; font-weight: 700;
      cursor: pointer; transition: all 0.2s; white-space: nowrap;
    }
    .esp32-btn-test:hover { transform: translateY(-1px); box-shadow: 0 4px 14px rgba(29,185,84,0.3); }
    .esp32-btn-test:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
    .esp32-status-line {
      margin-top: 10px; padding: 10px 14px; border-radius: 10px;
      font-size: 0.78rem; font-weight: 600;
      display: flex; align-items: center; gap: 8px;
    }
    .esp32-status-line.ok  { background: #dcfce7; color: #16a34a; border: 1px solid #86efac; }
    .esp32-status-line.err { background: #fee2e2; color: #dc2626; border: 1px solid #fca5a5; }
    .esp32-hints {
      margin-top: 14px; padding: 12px 14px; border-radius: 10px;
      background: var(--bg); border: 1px solid var(--border);
      font-size: 0.73rem; color: var(--text2); line-height: 1.7;
    }
    .esp32-hints code {
      background: rgba(29,185,84,0.12); color: var(--green-dark);
      padding: 1px 6px; border-radius: 4px; font-family: monospace;
    }
    .esp32-modal-footer {
      padding: 0 24px 22px;
      display: flex; gap: 10px; justify-content: flex-end;
    }
    .esp32-btn-cancel {
      padding: 9px 18px; border-radius: 10px; border: 1.5px solid var(--border2);
      background: var(--white); color: var(--text2); font-size: 0.82rem; font-weight: 600;
      cursor: pointer; transition: all 0.18s;
    }
    .esp32-btn-cancel:hover { background: var(--bg); }
    .esp32-btn-save {
      padding: 9px 20px; border-radius: 10px; border: none;
      background: linear-gradient(135deg, #1db954, #16a34a);
      color: #fff; font-size: 0.82rem; font-weight: 700;
      cursor: pointer; transition: all 0.18s;
      box-shadow: 0 2px 8px rgba(29,185,84,0.3);
    }
    .esp32-btn-save:hover { transform: translateY(-1px); box-shadow: 0 4px 14px rgba(29,185,84,0.4); }
    .esp32-btn-save:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    /* ══════════ ESP32 CAMERA PANEL ══════════ */
    .cam-mode-toggle {
      display: flex; background: var(--bg); border-radius: 12px;
      padding: 4px; gap: 4px; margin-bottom: 14px;
      border: 1.5px solid var(--border);
    }
    .cam-mode-btn {
      flex: 1; padding: 8px 12px; border-radius: 8px; border: none;
      font-size: 0.8rem; font-weight: 700; cursor: pointer;
      transition: all 0.2s; color: var(--text2); background: transparent;
    }
    .cam-mode-btn.active {
      background: linear-gradient(135deg, #0f172a, #1e293b);
      color: #fff; box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    }
    .cam-mode-btn:not(.active):hover { background: var(--white); }

    .esp32-stream-wrap {
      border-radius: 14px; overflow: hidden; position: relative;
      background: #0f1117; min-height: 200px;
      border: 2px solid var(--border); margin-bottom: 10px;
    }
    .esp32-stream-wrap img {
      width: 100%; height: auto; display: block; max-height: 300px; object-fit: contain;
    }
    .esp32-overlay-badge {
      position: absolute; top: 10px; left: 10px;
      background: rgba(0,0,0,0.65); backdrop-filter: blur(6px);
      color: #fff; font-size: 0.65rem; font-weight: 700;
      padding: 4px 10px; border-radius: 20px;
      display: flex; align-items: center; gap: 5px; border: 1px solid rgba(255,255,255,0.12);
    }
    .rec-dot {
      width: 6px; height: 6px; background: #ef4444; border-radius: 50%;
      animation: pulse 1.2s infinite;
    }
    .esp32-offline-box {
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; min-height: 200px; gap: 12px;
      padding: 24px;
    }
    .esp32-offline-icon {
      font-size: 3rem; opacity: 0.3; filter: grayscale(1);
    }
    .esp32-offline-title { font-size: 0.95rem; font-weight: 800; color: var(--text2); }
    .esp32-offline-sub   { font-size: 0.76rem; color: var(--text3); text-align: center; line-height: 1.6; }
    .btn-esp32-configure {
      padding: 8px 18px; border-radius: 10px; border: 1.5px solid var(--green);
      background: var(--green-pale); color: var(--green-dark);
      font-size: 0.8rem; font-weight: 700; cursor: pointer;
      transition: all 0.18s;
    }
    .btn-esp32-configure:hover { background: var(--green); color: #fff; transform: translateY(-1px); }

    .btn-capture {
      width: 100%; padding: 13px; border-radius: 12px; border: none;
      background: linear-gradient(135deg, #0f172a, #1e293b);
      color: #fff; font-size: 0.92rem; font-weight: 800;
      cursor: pointer; transition: all 0.22s;
      box-shadow: 0 4px 16px rgba(0,0,0,0.2);
      display: flex; align-items: center; justify-content: center; gap: 9px;
      margin-top: 10px;
    }
    .btn-capture:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,0,0,0.25); }
    .btn-capture:active { transform: translateY(0); }
    .btn-capture:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    /* ══════════ RESULT ENRICHI ══════════ */
    .rc-plant-badge {
      display: inline-flex; align-items: center; gap: 5px;
      background: var(--green-pale); border: 1px solid #a7f3c3;
      border-radius: 20px; padding: 3px 12px;
      font-size: 0.72rem; font-weight: 700; color: var(--green-dark);
      margin-bottom: 10px;
    }
    .rc-detail-row {
      background: var(--bg); border-radius: 10px;
      padding: 10px 12px; margin-top: 8px;
      font-size: 0.76rem; color: var(--text2); line-height: 1.6;
    }
    .rc-detail-row strong { color: var(--text); }
    .rc-treatment {
      margin-top: 8px; background: #fef9c3;
      border-left: 3px solid #f59e0b;
      border-radius: 0 8px 8px 0; padding: 9px 12px;
      font-size: 0.76rem; color: #78350f; line-height: 1.5;
    }
    body.dark .rc-treatment { background: #292000; color: #fcd34d; border-color: #d97706; }
    .rc-top5 { margin-top: 10px; }
    .rc-top5-title { font-size: 0.68rem; font-weight: 700; color: var(--text3);
      text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; }
    .rc-top5-item {
      display: flex; align-items: center; gap: 8px;
      font-size: 0.73rem; color: var(--text2); margin-bottom: 4px;
    }
    .rc-top5-bar-bg { flex:1; height: 5px; background: var(--border); border-radius: 10px; overflow: hidden; }
    .rc-top5-bar-fill { height: 100%; border-radius: 10px; transition: width 0.8s; }
    .rc-top5-pct { font-weight: 700; color: var(--text); min-width: 36px; text-align: right; font-size: 0.7rem; }

    /* ══════════════ FARMER AVATAR ══════════════ */
    .fa-wrap {
      position: fixed; bottom: 24px; right: 24px; z-index: 1000;
      display: flex; align-items: flex-end; gap: 0;
      pointer-events: none;
    }
    @media(max-width:768px){ .fa-wrap { transform: scale(0.6); transform-origin: bottom right; } }

    /* ── Bulle de dialogue ── */
    .fa-bubble {
      background: #fff; border: 1.5px solid rgba(29,185,84,.35);
      border-radius: 14px; padding: 10px 14px;
      max-width: 200px; margin-bottom: 22px;
      box-shadow: 0 4px 20px rgba(0,0,0,.18);
      position: relative;
      animation: fa-pop 0.45s cubic-bezier(0.34,1.56,0.64,1) both;
    }
    body.dark .fa-bubble { background: #1a1d27; border-color: rgba(29,185,84,.4); }
    .fa-bubble-text { font-size: .72rem; font-weight: 600; color: #0f172a; line-height: 1.55; margin: 0; }
    body.dark .fa-bubble-text { color: #f1f5f9; }
    /* Queue droite de la bulle */
    .fa-bubble::after {
      content: ''; position: absolute; right: -9px; bottom: 22px;
      border: 8px solid transparent; border-left-color: #fff; border-right: 0;
    }
    .fa-bubble::before {
      content: ''; position: absolute; right: -12px; bottom: 21px;
      border: 9px solid transparent; border-left-color: rgba(29,185,84,.35); border-right: 0;
    }
    body.dark .fa-bubble::after  { border-left-color: #1a1d27; }
    body.dark .fa-bubble::before { border-left-color: rgba(29,185,84,.4); }
    @keyframes fa-pop { from{opacity:0;transform:scale(0) translateY(16px)} to{opacity:1;transform:scale(1) translateY(0)} }

    /* ── SVG transforms ── */
    .fa-arm-l  { transform-box: fill-box; transform-origin: 100% 50%; transition: transform .4s ease; }
    .fa-arm-r  { transform-box: fill-box; transform-origin: 0%   50%; transition: transform .4s ease; }
    .fa-head-g { transform-box: fill-box; transform-origin: 50%  50%; transition: transform .5s ease; }
    .fa-body-g { transform-box: fill-box; transform-origin: 50% 100%; }
    .fa-eye-l  { transform-box: fill-box; transform-origin: 50%  50%; }
    .fa-eye-r  { transform-box: fill-box; transform-origin: 50%  50%; }
    /* ── Expressions : tout masqué par défaut ; activé par état ── */
    .fa-brow-n, .fa-brow-w, .fa-brow-h { display: none; }
    .fa-m-sad,  .fa-m-happy, .fa-m-hmm { display: none; }
    .fa-tears,  .fa-confetti            { display: none; }
    .fa-sweat,  .fa-q-mark              { display: none; }

    /* ═══ IDLE ═══ */
    .farmer-idle .fa-brow-n { display: block; }
    .farmer-idle .fa-body-g { animation: fa-breathe 3s ease-in-out infinite; }
    .farmer-idle .fa-head-g { animation: fa-sway    4s ease-in-out infinite; }

    /* ═══ LOADING ═══ */
    .farmer-loading .fa-brow-w      { display: block; }
    .farmer-loading .fa-m-hmm       { display: block; }
    .farmer-loading .fa-sweat       { display: block; }
    .farmer-loading .fa-arm-l       { transform: rotate(20deg); }
    .farmer-loading .fa-arm-r       { transform: rotate(-20deg); }
    .farmer-loading .fa-avatar-inner{ animation: fa-tremble .12s linear infinite; }
    .farmer-loading .fa-eye-l       { animation: fa-fast-blink .45s ease-in-out infinite; }
    .farmer-loading .fa-eye-r       { animation: fa-fast-blink .45s ease-in-out .06s infinite; }

    /* ═══ HEALTHY ═══ */
    .farmer-healthy .fa-brow-h     { display: block; }
